/* ---- AI 공모전 ---- */
var CONTEST_URLS = {
  domestic: "https://junyeo217.github.io/ai-contest-board/data/contests.json",
  overseas: "https://junyeo217.github.io/ai-contest-board/data/overseas-contests.json"
};
var CONTEST_BOARD = "https://junyeo217.github.io/ai-contest-board/";
/* 세션 캐시 (두 파일 각각). 공모전 데이터는 자주 바뀌지 않으므로 한 번 받으면
   세션 동안 재요청하지 않는다 — 갱신이 필요하면 화면의 [↻ 갱신] 이 force 로 부른다.
   첫 로드 때는 아예 받지 않는다: 공모전 메뉴를 열 때가 첫 요청 시점이다. */
var contestCache = {};        /* { domestic:{t,data}, overseas:{t,data} } */
var contestTab = "domestic", contestCat = "전체", contestSearch = "";
function cachedContests(kind){ var c = contestCache[kind]; return c ? c.data : null; }
function fetchContests(kind, force){
  var c = contestCache[kind];
  if (!force && c) return Promise.resolve(c.data);
  return fetch(CONTEST_URLS[kind], { cache:"no-store" }).then(function(r){
    if (!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(j){ contestCache[kind] = { t:Date.now(), data:j }; return j; });
}
function ctSafeUrl(u){ try { var p = new URL(String(u||"")); return (p.protocol === "http:" || p.protocol === "https:") ? p.href : ""; } catch(e){ return ""; } }
function ctFmtGen(g){ if(!g) return ""; return String(g).replace("T"," ").replace(/(:\d\d)(\.\d+)?(Z|[+-]\d\d:?\d\d)?$/,"$1").slice(0,16); }
function ctCount(sec){ return (sec&&sec.ongoing||[]).concat(sec&&sec.starting_today||[]); }
/* 마감 임박(7일 이내, 국내+해외) 카운트 — 대시보드 레일에서 재사용 */
function countImpendingContests(data){
  if (!data || !data.sections) return 0;
  var now = seoulNow(), today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var n = 0;
  ctCount(data.sections).forEach(function(it){
    var e = parseDate(it.submission_end); if(!e) return;
    var diff = Math.round((e-today)/86400000);
    if (diff>=0 && diff<=7) n++;
  });
  return n;
}
function renderContests(){
  var now = seoulNow(), today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var actions = "<button class='btn sm' data-ct-refresh>↻ 갱신</button>";
  var html = pageHead("contests", "데이터: <b>AI 공모전 보드</b>(자동 갱신) · <span class='ct-credit' data-ct-gen>불러오는 중…</span>", actions);
  html += "<div class='ct-tabs' data-ct-tabs>"+
    [["domestic","국내"],["overseas","해외"]].map(function(t){
      return "<button class='proj-chip"+(t[0]===contestTab?" on":"")+"' data-ct-tab='"+esc(t[0])+"'>"+esc(t[1])+"</button>";
    }).join("")+"</div>";
  html += "<div class='ct-controls'><input class='proj-search' type='text' placeholder='제목·주최 검색' data-ct-search>"+
    "<div class='ct-cats' data-ct-cats></div></div>";
  html += "<div data-ct-body><div class='empty'>공모전 보드를 불러오는 중…</div></div>";
  C.innerHTML = html;

  var bodyEl = C.querySelector("[data-ct-body]");
  var catsEl = C.querySelector("[data-ct-cats]");
  var genEl  = C.querySelector("[data-ct-gen]");
  var searchEl = C.querySelector("[data-ct-search]");
  searchEl.value = contestSearch;
  var curData = null;

  function collectCats(data){
    var set = {}, order = [];
    ["starting_today","ongoing","awaiting_results"].forEach(function(k){
      ((data.sections&&data.sections[k])||[]).forEach(function(it){
        var c = String(it.category||"").trim();
        if (c && !set[c]){ set[c]=1; order.push(c); }
      });
    });
    return order;
  }
  function drawCats(){
    var chips = ["전체"].concat(curData ? collectCats(curData) : []);
    if (contestCat!=="전체" && chips.indexOf(contestCat)<0) contestCat = "전체";
    catsEl.innerHTML = chips.map(function(c){
      return "<button class='proj-chip"+(c===contestCat?" on":"")+"' data-ct-cat='"+esc(c)+"'>"+esc(c)+"</button>";
    }).join("");
    catsEl.querySelectorAll("[data-ct-cat]").forEach(function(b){
      b.onclick = function(){ contestCat = b.getAttribute("data-ct-cat"); drawCats(); drawBody(); };
    });
  }
  function match(it){
    if (contestCat!=="전체" && String(it.category||"")!==contestCat) return false;
    var q = String(contestSearch||"").trim().toLowerCase();
    if (!q) return true;
    return String(it.title||"").toLowerCase().indexOf(q)>=0 ||
           String(it.organizer||"").toLowerCase().indexOf(q)>=0;
  }
  function contestCard(it){
    var di = ddayInfo(it.submission_end, today, false);
    var url = ctSafeUrl(it.url);
    var titleBits = "<span>"+esc(it.title||"(제목 없음)")+"</span>";
    if (it.category) titleBits += "<span class='ct-tag'>"+esc(it.category)+"</span>";
    if (it.country)  titleBits += "<span class='ct-country'>"+esc(it.country)+"</span>";
    var metaBits = [];
    if (it.organizer) metaBits.push("<b>"+esc(it.organizer)+"</b>");
    var sd = String(it.submission_start||"").slice(0,10), ed = String(it.submission_end||"").slice(0,10);
    if (sd || ed) metaBits.push("접수 "+esc(sd||"미정")+" ~ "+esc(ed||"미정"));
    var rd = String(it.result_date||"").trim();
    if (rd && rd!=="미정") metaBits.push("발표 "+esc(rd.slice(0,10)));
    var inner =
      "<div class='dday "+di.cls+" tnum'>"+di.txt+"</div>"+
      "<div class='ct-main'><div class='ct-title'>"+titleBits+"</div>"+
      "<div class='ct-meta'>"+metaBits.join("<span>·</span>")+"</div>"+
      (it.summary?"<div class='ct-sum'>"+esc(it.summary)+"</div>":"")+"</div>";
    if (url) return "<a class='ct-card' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+inner+"</a>";
    return "<div class='ct-card'>"+inner+"</div>";
  }
  function drawBody(){
    if (!curData){ return; }
    var sec = curData.sections || {};
    var ongoing = ((sec.ongoing||[]).concat(sec.starting_today||[])).filter(match)
      .sort(function(a,b){ return String(a.submission_end||"9999").localeCompare(String(b.submission_end||"9999")); });
    var awaiting = (sec.awaiting_results||[]).filter(match);

    var h = "<section class='panel'><div class='sec-head'><div><div class='eyebrow'>모집 중</div>"+
      "<h3>진행중 공모전</h3></div><div class='sec-note'>"+ongoing.length+"건 · 마감 임박순</div></div><div class='ct-list'>";
    if (!ongoing.length) h += "<div class='empty'>표시할 진행중 공모전이 없습니다.</div>";
    else ongoing.forEach(function(it){ h += contestCard(it); });
    h += "</div></section>";

    h += "<section class='panel collapsed' data-foldsec><div class='sec-head fold-head' data-fold>"+
      "<div><div class='eyebrow'>결과 발표</div><h3>발표 대기 <span style='color:var(--ink-3);font-weight:600'>("+awaiting.length+")</span></h3></div>"+
      "<span class='fold-btn'>▾</span></div><div class='fold-body'><div class='ct-await-list'>";
    if (!awaiting.length) h += "<div class='empty'>발표 대기 중인 공모전이 없습니다.</div>";
    else awaiting.forEach(function(it){
      var rd = String(it.result_date||"").trim();
      h += "<div class='ct-await-row'><span class='caw-title'>"+esc(it.title||"(제목 없음)")+"</span>"+
        (it.organizer?"<span class='caw-org'>"+esc(it.organizer)+"</span>":"")+
        "<span class='caw-date tnum'>발표 "+esc(rd && rd!=="미정" ? rd.slice(0,10) : "미정")+"</span></div>";
    });
    h += "</div></div></section>";

    bodyEl.innerHTML = h;
    /* 발표 대기 섹션 기본 접힘 */
    var fs = bodyEl.querySelector("[data-foldsec]"); if (fs) fs.classList.add("collapsed");
    bindFold(bodyEl);
  }
  function showFail(){
    curData = null;
    genEl.textContent = "불러오기 실패";
    catsEl.innerHTML = "";
    bodyEl.innerHTML = "<div class='ct-fail'><div class='ico'>📡</div><h3>공모전 보드를 불러오지 못했습니다</h3>"+
      "<p>네트워크 상태를 확인한 뒤 다시 시도하거나, 원본 보드를 직접 확인하세요.</p>"+
      "<p><a href='"+esc(CONTEST_BOARD)+"' target='_blank' rel='noopener noreferrer'>AI 공모전 보드 열기 ↗</a></p></div>";
  }
  function load(force){
    bodyEl.innerHTML = "<div class='empty'>공모전 보드를 불러오는 중…</div>";
    genEl.textContent = "불러오는 중…";
    fetchContests(contestTab, force).then(function(j){
      if (curRoute()!=="contests") return;   /* 라우트 이탈 시 무시 */
      curData = j;
      genEl.textContent = j.generated_at ? ("업데이트 "+ctFmtGen(j.generated_at)) : "";
      drawCats(); drawBody();
    }).catch(function(){ if (curRoute()==="contests") showFail(); });
  }

  C.querySelectorAll("[data-ct-tab]").forEach(function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-ct-tab"); if (k===contestTab) return;
      contestTab = k; contestCat = "전체";
      C.querySelectorAll("[data-ct-tab]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-ct-tab")===contestTab); });
      load(false);
    };
  });
  searchEl.oninput = function(){ contestSearch = searchEl.value; if (curData) drawBody(); };
  var rf = C.querySelector("[data-ct-refresh]");
  if (rf) rf.onclick = function(){ delete contestCache[contestTab]; load(true); };

  load(false);
}

  if ((att.type || "").toLowerCase() === "image") return true;
  return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(att.name || "");
}

function attIsPdf(att){
  if (!att) return false;
  if ((att.type || "").toLowerCase() === "pdf") return true;
  return /\.pdf$/i.test(att.name || "");
}

/* mp4 등 동영상 판별 — 재생은 구글드라이브 플레이어(새 창)로 연결 */
function attIsVideo(att){
  if (!att) return false;
  if ((att.type || "").toLowerCase() === "video") return true;
  return /\.(mp4|mov|m4v|webm|avi|mkv|wmv|flv|mpg|mpeg)$/i.test(att.name || "");
}

/* 화면에 바로 그릴 수 있는 이미지 주소. 없으면 null */
/* 드라이브 이미지는 구글이 외부 사이트 직링크(thumbnail·uc·lh3)를 차단하므로
   서버(action=driveImage)를 통해 받아 data: URL 로 표시한다. 받은 뒤에는 캐시. */
var driveImgCache = {};
function attImageSrc(att){
  if (!att) return null;
  var url = String(att.url || "");
  if (url.indexOf("data:") === 0) return url;
  var id = att.gdrive_id || parseGoogleDriveFileId(url);
  if (id) return driveImgCache[id] || null;   /* 아직 못 받았으면 null → 로드 후 채움 */
  if (/^https?:\/\//i.test(url)) return url;
  return null;
}
/* 화면에 그려진 드라이브 이미지들을 서버에서 받아 채워 넣는다 */
function loadDriveImages(root){
  var r = root || C;
  if (!r || !r.querySelectorAll) return;
  var imgs = r.querySelectorAll("[data-drive-img]");
  for (var i = 0; i < imgs.length; i++){
    (function(im){
      var id = im.getAttribute("data-drive-img");
      if (!id) return;
      if (driveImgCache[id]){ im.src = driveImgCache[id]; return; }
      apiSend("POST", null, null, { action: "driveImage", fileId: id }).then(function(res){
        if (res && res.ok && res.data){
          driveImgCache[id] = "data:" + (res.mimeType || "image/png") + ";base64," + res.data;
          im.src = driveImgCache[id];
        } else {
          var w = im.parentNode; if (w) w.style.display = "none";
        }
      }).catch(function(){
        var w = im.parentNode; if (w) w.style.display = "none";
      });
    })(imgs[i]);
  }
}

/* 이미지 첨부만 골라 세로로 나열하는 HTML. 대상이 없으면 빈 문자열 */
function renderInlineImages(atts){
  var arr = Array.isArray(atts) ? atts : [];
  var out = "";
  for (var i = 0; i < arr.length; i++){
    var a = arr[i];
    if (!attIsImage(a)) continue;
    var src = attImageSrc(a);
    var did = a.gdrive_id || parseGoogleDriveFileId(String(a.url || ""));
    /* 드라이브 파일은 src 를 비워 두고 data-drive-img 로 표시 → loadDriveImages 가 채운다 */
    if (!src && !did) continue;
    var nm = esc(a.name || "");
    out += "<figure class='bd-img-wrap'>"+
      "<img class='bd-img-el'"+(src ? " src=\""+esc(src)+"\"" : "")+
        (did ? " data-drive-img=\""+esc(did)+"\"" : "")+" alt=\""+nm+"\">"+
      "<figcaption class='bd-img-cap'>"+nm+"</figcaption>"+
    "</figure>";
  }
  return out;
}

/* 이미지 로딩 실패 시 해당 블록만 숨긴다(HTML onerror 속성 대신 JS로 바인딩) */
function bindInlineImageFallback(root){
  var r = root || C;
  if (!r || !r.querySelectorAll) return;
  loadDriveImages(r);            /* 드라이브 이미지는 서버에서 받아 채운다 */
  var imgs = r.querySelectorAll(".bd-img-el");
  for (var i = 0; i < imgs.length; i++){
    (function(im){
      im.onerror = function(){ var w = im.parentNode; if (w) w.style.display = "none"; };
    })(imgs[i]);
  }
}

function restoreSearchFocus(input){
  if (!input) return;
  try{
    input.focus();
    var len = input.value.length;
    input.setSelectionRange(len, len);
  }catch(e){}
}

/* atts 테이블에서 id로 첨부 1건 찾기 */
function libAttFindById(id){
  if (id == null) return null;
  var all = (state.data && Array.isArray(state.data.atts)) ? state.data.atts : [];
  for (var i = 0; i < all.length; i++){
    if (all[i] && String(all[i].id) === String(id)) return all[i];
  }
  return null;
}

function libProjectById(pid){
  if (pid == null) return null;
  var ps = (state.data && Array.isArray(state.data.projects)) ? state.data.projects : [];
  for (var i = 0; i < ps.length; i++){
    if (ps[i] && String(ps[i].id) === String(pid)) return ps[i];
  }
  return null;

/* 게시글 + 프로젝트 첨부파일을 하나의 목록으로 합친다.
   att.project_id 가 프로젝트 id 인 행만 파일 항목으로 넣는다.
   (게시글 첨부는 project_id 가 글 id 이므로 제외 — 글 행에 첨부수로 이미 표시됨) */
function libUnifiedItems(){
  var items = [];
  var rows = boardRows();
  rows.forEach(function(r, i){
    items.push({ kind: "post", row: r, seq: i, date: String(r.date || "") });
  });

  var ps = (state.data && Array.isArray(state.data.projects)) ? state.data.projects : [];
  var pmap = {};
  ps.forEach(function(p){ if (p && p.id != null) pmap[String(p.id)] = p; });

  var all = (state.data && Array.isArray(state.data.atts)) ? state.data.atts : [];
  all.forEach(function(a, i){
    if (!a || a.project_id == null || a.project_id === "") return;
    var p = pmap[String(a.project_id)];
    if (!p) return;
    items.push({
      kind: "file", att: a, project: p,
      projectName: p.name || "미지정 프로젝트",
      client: p.client || "",
      seq: rows.length + i,
      date: String(a.date || "")
    });
  });
  return items;
}

/* ---- 자료실 내부 화면 = URL 해시 ----
   목록 #library / 글 상세 #library/post/<id> / 글쓰기 #library/new
   수정 #library/edit/<id> / 파일 상세 #library/file/<첨부id>
   해시를 단일 진실 소스로 삼아 브라우저 뒤로가기가 바로 전 단계로 돌아가게 한다. */
function libHash(view, id){
  if (view === "detail") return "#library/post/" + encodeURIComponent(String(id));
  if (view === "file") return "#library/file/" + encodeURIComponent(String(id));
  if (view === "edit") return "#library/edit/" + encodeURIComponent(String(id));
  if (view === "new") return "#library/new";
  return "#library";
}

/* 해시를 바꿔 화면을 전환한다. 해시가 이미 같으면 hashchange 가 뜨지 않으므로 직접 다시 그린다.
   (해시가 바뀌면 hashchange → render() → renderLibrary() 가 자동 실행되므로 직접 호출하지 않는다) */
function libGo(view, id){
  var h = libHash(view, id);
  if (location.hash === h){ renderLibrary(); return; }
  location.hash = h;
}

/* 현재 해시에서 자료실 내부 화면과 대상 id 를 읽는다 */
function libParseHash(){
  var parts = location.hash.replace(/^#/, "").split("/");
  var seg = parts[1] || "";
  var id = parts[2] ? decodeURIComponent(parts[2]) : "";
  if (seg === "post" && id) return { view: "detail", id: id };
  if (seg === "file" && id) return { view: "file", id: id };
  if (seg === "edit" && id) return { view: "form", id: id };
  if (seg === "new") return { view: "form", id: null };
  return { view: "list", id: null };
}

/* 저장하지 않고 글쓰기 화면을 벗어날 때, 미리 올려둔 드라이브 파일 정리(고아 방지) */
function libDiscardPending(){
  var items = libBoardPending.slice();
  libBoardPending = [];
  for (var i = 0; i < items.length; i++){
    (function(it){
      try { discardOrphanDriveFile(it.gdrive_id || parseGoogleDriveFileId(it.url)); } catch(e){}
    })(items[i]);
  }
}

function renderLibrary(){
  var st = libParseHash();

  /* 없는 id 는 목록으로 안전 폴백 */
  if (st.view === "detail" && !boardFindById(st.id)){ libGo("list"); return; }
  if (st.view === "file" && !libAttFindById(st.id)){ libGo("list"); return; }
  if (st.view === "form" && st.id && !boardFindById(st.id)){ libGo("list"); return; }

  /* 글쓰기 화면이 바뀌었으면(다른 글 수정 / 목록 이탈) 임시 입력값·보류 첨부를 정리 */
  var formKey = st.view === "form" ? (st.id ? "edit:" + st.id : "new") : "";
  if (formKey !== libBoardFormKey){
    if (libBoardFormKey && libBoardPending.length) libDiscardPending();
    libBoardForm = null;
    libBoardFormKey = formKey;
  }

  libBoardView = st.view;
  libBoardId = (st.view === "detail" || st.view === "form") ? st.id : null;
  libFileId = st.view === "file" ? st.id : null;

  if (libBoardView === "file") { renderFileDetail(); return; }
  if (libBoardView === "detail") { renderBoardDetail(); return; }
  if (libBoardView === "form") { renderBoardForm(); return; }
  renderBoardList();
}

/* 자료실에서 바로 파일만 올리는 버튼(프로젝트 선택 후 업로드) */
function bindLibUploadButton(){
  var uploadBtn = C.querySelector("#libUploadBtn");
  var fileInput = C.querySelector("#libFileInput");
  if (!uploadBtn || !fileInput) return;
  uploadBtn.onclick = function(){
    var projects = (state.data && Array.isArray(state.data.projects)) ? state.data.projects : [];
    if (!projects.length){ alert("등록된 프로젝트가 없습니다."); return; }
    var pSelName = prompt("파일을 추가할 프로젝트명을 선택하세요:\n" + projects.map(function(p){ return "- " + p.name; }).join("\n"), projects[0].name);
    if (!pSelName) return;
    var targetP = projects.find(function(p){ return p.name === pSelName || String(p.name || "").indexOf(pSelName) >= 0; });
    if (!targetP){ alert("존재하지 않는 프로젝트입니다."); return; }
    fileInput.onchange = function(){
      handleFileUploadOrDrivePrompt(fileInput.files, null, renderLibrary, targetP.id);
      fileInput.value = "";
    };
    fileInput.click();
  };
}

/* ---- 자료실: 통합 목록 (게시글 + 프로젝트 첨부파일) ---- */
function renderBoardList(){
  var items = libUnifiedItems();

  var q = String(libBoardSearch || "").trim().toLowerCase();
  if (q){
    items = items.filter(function(it){
      if (it.kind === "post"){
        var r = it.row;
        return String(r.title || "").toLowerCase().indexOf(q) >= 0 ||
               String(r.author || "").toLowerCase().indexOf(q) >= 0 ||
               String(r.content || "").toLowerCase().indexOf(q) >= 0;
      }
      return String(it.att.name || "").toLowerCase().indexOf(q) >= 0 ||
             String(it.projectName || "").toLowerCase().indexOf(q) >= 0 ||
             String(it.client || "").toLowerCase().indexOf(q) >= 0;
    });
  }

  items.sort(function(a, b){
    var da = a.date, db = b.date;
    if (da !== db) return da < db ? 1 : -1;
    return b.seq - a.seq;
  });

  var total = items.length;
  var pages = Math.max(1, Math.ceil(total / LIB_PER_PAGE));
  if (libBoardPage > pages) libBoardPage = pages;
  if (libBoardPage < 1) libBoardPage = 1;
  var start = (libBoardPage - 1) * LIB_PER_PAGE;
  var pageItems = items.slice(start, start + LIB_PER_PAGE);

  /* 파일 업로드는 글쓰기 화면에서 첨부로 처리하므로 상단 버튼은 두지 않는다.
     글쓰기 버튼은 목록 아래(페이지네이션 옆)에 배치 — 일반적인 게시판 배치와 동일 */
  var html = pageHead("library", LIB_DESC, "");

  html += "<div class='panel' style='margin-bottom:20px;'><div class='panel-b' style='display:flex; flex-wrap:wrap; gap:12px; align-items:center;'>"+
    "<input type='text' class='proj-search' id='bdSearchInput' placeholder='제목·작성자·내용·파일명·프로젝트 검색' value='"+esc(libBoardSearch)+"' style='flex:1; min-width:200px;'>"+
    "</div></div>";

  html += "<section class='panel'><div class='sec-head'><div><div class='eyebrow'>자료실</div>"+
    "<h3>전체 ("+total+"건)</h3></div></div><div class='panel-b'>";

  if (!total){
    html += "<div class='empty'>"+(q ? "검색 결과가 없습니다." : "등록된 자료가 없습니다.<br>아래 '글쓰기'로 자료를 등록해보세요. (글 작성 화면에서 파일을 첨부합니다)")+"</div>";
  } else {
    html += "<div class='tbl-scroll'><table><thead><tr><th class='c'>번호</th><th>제목</th>"+
      "<th class='c'>작성자</th><th class='c'>날짜</th><th class='c'>조회</th></tr></thead><tbody>";
    pageItems.forEach(function(it, i){
      var no = total - (start + i);
      if (it.kind === "file"){
        var att = it.att;
        html += "<tr class='bd-row' data-bd-file='"+esc(att.id)+"' style='cursor:pointer'>"+
          "<td class='c tnum'>"+no+"</td>"+
          "<td>"+
            "<span style='margin-right:6px'>📎</span>"+
            "<span class='att-badge file' style='margin-right:6px'>"+esc(it.projectName)+"</span>"+
            "<span style='font-weight:600'>"+esc(att.name || "(파일명 없음)")+"</span>"+
          "</td>"+
          "<td class='c'>파일</td>"+
          "<td class='c tnum'>"+esc(att.date || "")+"</td>"+
          "<td class='c tnum'>-</td>"+
        "</tr>";
        return;
      }
      var r = it.row;
      var cat = String(r.category || "");
      var nAtt = attRowsForProjectId(r.id).length;
      html += "<tr class='bd-row' data-bd-open='"+esc(r.id)+"' style='cursor:pointer'>"+
        "<td class='c tnum'>"+no+"</td>"+
        "<td>"+
          (cat ? "<span class='att-badge file' style='margin-right:6px'>"+esc(cat)+"</span>" : "")+
          "<span style='font-weight:600'>"+esc(r.title || "(제목 없음)")+"</span>"+
          (nAtt ? "<span style='color:var(--ink-3);font-size:12px;margin-left:6px'>["+nAtt+"]</span>" : "")+
        "</td>"+
        "<td class='c'>"+esc(r.author || "")+"</td>"+
        "<td class='c tnum'>"+esc(r.date || "")+"</td>"+
        "<td class='c tnum'>"+(Number(r.views) || 0)+"</td>"+
      "</tr>";
    });
    html += "</tbody></table></div>";

    if (pages > 1){
      var from = Math.max(1, libBoardPage - 2);
      var to = Math.min(pages, from + 4);
      from = Math.max(1, to - 4);
      html += "<div class='proj-chips bd-pager'>"+
        "<button class='proj-chip' data-bd-page='1'>« 처음</button>";
      for (var pn = from; pn <= to; pn++){
        html += "<button class='proj-chip"+(pn === libBoardPage ? " on" : "")+"' data-bd-page='"+pn+"'>"+pn+"</button>";
      }
      html += "<button class='proj-chip' data-bd-page='"+pages+"'>끝 »</button></div>";
    }
  }
  html += "</div></section>";
  /* 글쓰기 버튼: 패널 바깥 오른쪽 — 상세 화면의 목록·수정·삭제 버튼과 동일한 위치 */

    tr.onclick = function(e){

    tr.onclick = function(e){
      if (e && e.target && e.target.closest && (e.target.closest("button") || e.target.closest(".row-actions"))) return;
      libGo("file", tr.getAttribute("data-bd-file"));
    };

    b.onclick = function(){

      /* 글이 만들어진 직후, 미리 올려둔 첨부를 그 글 id로 연결한다 */
      if (newId){
        await flushPendingAttachments(newId, libBoardPending);

        libGo("detail", newId);
      } else {
        libBoardPage = 1;
        libGo("list");
      }
    };
  }
}

/* ============ 홈페이지 (apple-seed.co.kr 방문 · 리드) ============
   데이터 계약: 홈페이지 저장소 docs/specs/dashboard-visits.md 가 정본.
   GET ?action=stats&period=7|30|365
     → { ok, period, days:[{date,pageviews,visitors,leads}…오래된→오늘], totals:{pageviews,visitors,leads}, conversionRate }
   GET ?action=leads&key=…&limit=20
     → { ok, leads:[{submittedAt,source,email,company,name,budget,amountMedian,amountText,status,…}] } (최신순)
   목 검증: window.__MOCK__.homepageStats = {7:응답,30:응답,365:응답}
           window.__MOCK__.homepageLeads = {ok:true, leads:[…]}
   백엔드(Apps Script 수신부) 미배포 시에는 대기 안내를 띄운다 — 화면이 깨지지 않아야 한다. */
var hpPeriod = 7;
var hpStatsCache = {};          /* period → {t, data} */
var hpLeadsCache = null;        /* {t, data} */
/* 캐시 수명 5분. 전에는 60초였는데 시트 동기화 주기와 정확히 같아서, 주기 갱신이
   render() 를 태울 때마다 TTL 이 딱 지나 있어 매번 재요청이 나갔다.
   실측: 무조작 4분에 stats 4건 + leads 2건이 나갔고, 그때마다 "방문 통계를 불러오는 중…"이
   화면을 비웠다(4회). 지금은 둘 다 0 이다.
   여기 숫자는 일별 집계다 — 오늘 방문자 수가 1분 단위로 정확할 이유가 없고,
   동기화 주기의 배수로 잡아야 "매번 만료" 가 재발하지 않는다. 화면의 기간 칩을
   누르거나 화면을 다시 열면 그때 최신을 받는다. */
var HP_TTL = 5*60*1000;

function hpFetchStats(period){
  if (window.__MOCK__){
    var m = window.__MOCK__.homepageStats;
    return Promise.resolve((m && m[period]) || null);
  }
  var c = hpStatsCache[period];
  if (c && (Date.now()-c.t) < HP_TTL) return Promise.resolve(c.data);
  return fetch(RECEIVER_URL+"?action=stats&period="+period+"&key="+encodeURIComponent(KEY)+"&t="+Date.now(), { cache:"no-store" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.error === "unauthorized"){ keyRejected("접속 키가 거부되었습니다. 다시 입력해 주세요."); return "unauthorized"; }
      var d = (j && j.ok && Array.isArray(j.days)) ? j : null;
      if (d) hpStatsCache[period] = { t: Date.now(), data: d };
      return d;
    })
    .catch(function(){ return null; });   /* 수신부 미배포·네트워크 오류 → 대기 안내 */
}
function hpFetchLeads(){
  if (window.__MOCK__){
    var m = window.__MOCK__.homepageLeads;
    return Promise.resolve((m && m.ok && Array.isArray(m.leads)) ? m.leads : null);
  }
  if (hpLeadsCache && (Date.now()-hpLeadsCache.t) < HP_TTL) return Promise.resolve(hpLeadsCache.data);
  return fetch(RECEIVER_URL+"?action=leads&key="+encodeURIComponent(KEY)+"&limit=20&t="+Date.now(), { cache:"no-store" })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j && j.error === "unauthorized"){ keyRejected("접속 키가 거부되었습니다. 다시 입력해 주세요."); return "unauthorized"; }
      var d = (j && j.ok && Array.isArray(j.leads)) ? j.leads : null;
      if (d) hpLeadsCache = { t: Date.now(), data: d };
      return d;
    })
    .catch(function(){ return null; });
}

/* 일별 방문자 막대 (barChartSVG와 같은 축·그리드·툴팁 문법, 단일 시리즈).
   년(365) 보기는 월 단위로 묶는다 — 365개 막대는 읽을 수 없다. */
function hpChartSVG(days, period){
  var buckets = days || [];
  if (period === 365){
    var byM = {}, ord = [];
    buckets.forEach(function(d){
      var m = String(d.date||"").slice(0,7);
      if (!byM[m]){ byM[m] = { date:m, pageviews:0, visitors:0, leads:0 }; ord.push(m); }
      byM[m].pageviews += Number(d.pageviews)||0;
      byM[m].visitors  += Number(d.visitors)||0;
      byM[m].leads     += Number(d.leads)||0;
    });
    buckets = ord.map(function(k){ return byM[k]; });
  }
  if (!buckets.length) return "<div class='empty'>표시할 방문 데이터가 없습니다.</div>";
  var W=720, H=260, padL=46, padR=16, padT=16, padB=36;
  var plotW=W-padL-padR, plotH=H-padT-padB, yb=padT+plotH;
  var maxV=1; buckets.forEach(function(b){ maxV=Math.max(maxV, Number(b.visitors)||0); });
  var step=Math.pow(10, Math.floor(Math.log(maxV)/Math.LN10));
  var maxY=Math.ceil(maxV/step)*step; if (maxY<maxV*1.05) maxY+=step;
  function yOf(v){ return yb-(v/maxY)*plotH; }
  var s="<svg class='bars' viewBox='0 0 "+W+" "+H+"' role='img'>";
  for (var g=0; g<=4; g++){
    var v=maxY*g/4, y=yOf(v);
    s+="<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' class='"+(g===0?"zero-line":"grid-line")+"'></line>";
    s+="<text x='"+(padL-8)+"' y='"+(y+4)+"' text-anchor='end' class='axis-txt'>"+comma(v)+"</text>";
  }
  var groupW=plotW/buckets.length, barW=Math.max(2, Math.min(40, groupW*0.62));
  var lblEvery = buckets.length<=13 ? 1 : Math.ceil(buckets.length/10);
  buckets.forEach(function(b,i){
    var x = padL + groupW*i + (groupW-barW)/2;
    var vis = Number(b.visitors)||0;
    var h = (vis/maxY)*plotH, y = yb-h;
    var lbl = period===365 ? esc(String(b.date).slice(2).replace("-","/")) : esc(String(b.date).slice(5));
    s+="<rect class='bar-rect' x='"+x+"' y='"+y+"' width='"+barW+"' height='"+Math.max(h, vis>0?1:0)+"' rx='3' fill='var(--accent)' data-tip=\"<b>"+lbl+"</b><div class=&#39;tt-row&#39;><span>방문자</span><span>"+comma(vis)+"</span></div><div class=&#39;tt-row&#39;><span>페이지뷰</span><span>"+comma(b.pageviews)+"</span></div><div class=&#39;tt-row&#39;><span>리드</span><span>"+comma(b.leads)+"</span></div>\"></rect>";
    if (i % lblEvery === 0){
      s+="<text x='"+(x+barW/2)+"' y='"+(yb+20)+"' text-anchor='middle' class='axis-txt'>"+lbl+"</text>";
    }
  });
  s+="</svg>";
  return s;
}

/* 요약 카드 5장 — 기준 데이터는 period=365 응답 하나(오늘·주간은 그 꼬리에서 계산) */
function hpCardsHTML(s){
  var days = s.days||[];

  var t = s.totals||{};
  var rate = Number(s.conversionRate)||0;   /* 수신부가 이미 % 값을 반환 (2.5 = 2.5%) */
  return "<div class='kpi'><div class='label'>오늘 방문</div><div class='big tnum'>"+comma(today)+"</div><div class='meta'>방문자 기준</div></div>"+
    "<div class='kpi'><div class='label'>이번 주 방문</div><div class='big tnum'>"+comma(week)+"</div><div class='meta'>최근 7일 방문자</div></div>"+
    "<div class='kpi'><div class='label'>누적 방문</div><div class='big tnum'>"+comma(t.visitors)+"</div><div class='meta'>최근 1년 방문자</div></div>"+
    "<div class='kpi k-ar'><div class='label'>리드</div><div class='big tnum'>"+comma(t.leads)+"</div><div class='meta'>최근 1년 · 견적+문의</div></div>"+

/* 유입 채널 · 나라별 — stats 응답의 sources/countries (없으면 패널 자체를 숨김) */
var HP_COUNTRY_NAMES = { KR:"한국", US:"미국", JP:"일본", CN:"중국", TW:"대만", HK:"홍콩", SG:"싱가포르", VN:"베트남", TH:"태국", ID:"인도네시아", IN:"인도", GB:"영국", DE:"독일", FR:"프랑스", CA:"캐나다", AU:"호주" };
function hpBarListHTML(items, labelOf){
  if (!items || !items.length) return "<div class='empty'>아직 데이터가 없습니다.</div>";

    var n = Number(x.count)||0, w = Math.max(4, Math.round(n/max*100));

      "<span class='hp-bar-track'><span class='hp-bar-fill' style='width:"+w+"%'></span></span>"+
      "<span class='hp-bar-count tnum'>"+comma(n)+"</span></div>";
  }).join("")+"</div>";
}
function hpTrafficHTML(s){

function hpLoad(){
  var want = hpPeriod;
  Promise.all([ hpFetchStats(365), want===365 ? Promise.resolve(null) : hpFetchStats(want) ]).then(function(res){
    if (curRoute() !== "homepage") return;                      /* 화면을 떠났으면 그리지 않음 */
    var body = C.querySelector("[data-hp-body]"); if (!body) return;
    if (res[0]==="unauthorized" || res[1]==="unauthorized") return;  /* 키 게이트가 이미 떴음 */
    var base = res[0];
    if (!base){ body.innerHTML = hpWaitingHTML(); return; }
    body.innerHTML =
      "<div class='kpis hp5'>"+hpCardsHTML(base)+"</div>"+
      "<section class='panel'><div class='sec-head'><div><div class='eyebrow'>방문 추이</div><h3>일별 방문자</h3></div>"+
      "<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap'><span class='sec-note' data-hp-sum></span>"+hpChipsHTML()+"</div></div>"+
      "<div class='chart-body'><div class='chart-scroll' data-hp-chart></div></div></section>"+
      hpTrafficHTML(base)+
      /* 리드 상세 표는 의뢰관리로 옮겼다 (대표 지시 2026-08-11).
         같은 데이터가 두 곳에 있으면 어디서 처리했는지 알 수 없다 — 메일에 대해
         어제 이미 같은 판단을 했다(의뢰는 의뢰관리 한 곳에만). 이 화면의 역할은
         유입 분석이므로 리드는 위 KPI 의 건수·전환율까지만 남기고 상세는 넘긴다.
         여기서 hpFetchLeads 도 부르지 않는다 — 안 그리는 데이터를 받을 이유가 없다. */
      "<section class='panel'><div class='sec-head'><div><div class='eyebrow'>리드</div><h3>누가 문의했나</h3></div>"+
      "<a class='btn sm ghost' style='text-decoration:none' href='#inquiries'>의뢰관리에서 보기 →</a></div>"+
      "<div style='padding:10px 22px 20px;font-size:13px;color:var(--ink-3)'>"+
      "회사·담당자·예산·상태 같은 의뢰 상세는 <b>의뢰관리 › 리드 상세</b>에서 봅니다. "+
      "이 화면은 유입 분석이라 리드는 위 건수·전환율까지만 둡니다.</div></section>";
    hpPaintChart(want===365 ? base : res[1]);
    body.querySelectorAll("[data-hp-period]").forEach(function(b){
      b.onclick = function(){
        hpPeriod = Number(b.getAttribute("data-hp-period"));
        var p = hpPeriod;
        body.querySelectorAll("[data-hp-period]").forEach(function(c){ c.classList.toggle("on", Number(c.getAttribute("data-hp-period"))===p); });
        var box = body.querySelector("[data-hp-chart]");
        if (box) box.innerHTML = "<div class='empty'>불러오는 중…</div>";
        hpFetchStats(p).then(function(sd){
          if (curRoute() !== "homepage" || sd === "unauthorized") return;
          if (p !== hpPeriod) return;                           /* 그 사이 다른 기간을 눌렀으면 폐기 */
          hpPaintChart(sd);
        });
      };
    });
    applyMask();
  });
}

/* ============ 메일관리 — 대표 지메일 받은편지함 + 회신 ============
   수신부 action=mail / mailPreview / mailReply 가 어드민 이메일 일치만 통과시킨다
   (등급으로 열지 않음 — 개인 메일함). 화면에서도 같은 게이트를 걸어 오해가 없게 한다.

   회신은 미리보기를 거쳐야만 보낼 수 있다. 우리는 디자인 회사고, 나가는 메일은 제품이다.
   미리보기 HTML 은 화면이 흉내내지 않고 수신부가 발송용 템플릿 그대로 돌려준다 —
   대표가 승인한 것과 실제로 나가는 것이 달라지면 안 된다. */
/* ── 분류 쿼리 (대표 지시 2026-08-09 — 받은편지함 전부가 아니라 의뢰·결제·업무만 본다)
   수신부는 ?q= 로 받은 지메일 검색어를 그대로 GmailApp.search 에 넘긴다.
   그래서 분류는 전부 여기 문자열로 끝난다 — 서버를 고칠 이유가 없다.
   아래 발신자 목록은 2026-08-09 시점 대표 받은편지함 실측으로 만든 것이다.
   광고가 새로 늘면 이 상수에 추가한다.

   도메인이 아니라 서브도메인 단위로 막는 곳이 있다(news.comfy.org, research.anthropic.com).
   같은 회사라도 invoice+statements@comfy.org / invoice+statements@mail.anthropic.com 은
   결제 메일이라 살려야 하기 때문이다. 도메인 전체를 막으면 청구서를 놓친다. */
var MAIL_Q_JUNK =
  "-category:promotions -category:social -subject:광고 " +
  "-from:(substack.com OR mobbin.com OR news.comfy.org OR send.vidiq.com OR news.synology.com " +
  "OR aimlapi.com OR viewtrap.com OR aliexpress.com OR kr.email.samsung.com " +
  "OR ollama.com OR kimpga.com OR research.anthropic.com)";

/* 의뢰 — 홈페이지 문의 폼·리드 메일. 제목 태그로 확실히 잡힌다.
   포함 조건(MATCH)과 제외 조건을 나눠 둔 것은 업무 탭이 MATCH 만 빼야 하기 때문이다(아래). */
var MAIL_Q_REQUEST_MATCH = "(subject:\"[문의]\" OR subject:\"[리드]\" OR subject:\"[APPLΞSEED]\")";
var MAIL_Q_REQUEST = MAIL_Q_REQUEST_MATCH + " -from:notifications@github.com";

/* 결제 — 청구서·영수증·정기결제. 전부 포함 조건이라 그대로 부정할 수 있다. */
var MAIL_Q_PAYMENT =
  "(subject:(청구서 OR 영수증 OR 결제 OR 입금 OR 세금계산서 OR invoice OR receipt " +
  "OR payment OR billing OR credit) " +
  "OR from:(billing OR invoice OR payments OR googleplay-noreply@google.com))";

/* 탭. 문자열을 손으로 쓰지 않고 위 상수를 조합한다 — 상수를 고치면 탭이 따라온다.

   업무는 "포함 키워드"가 아니라 "제외" 방식이다. 키워드로 포함시키면 처음 보는 발신자의
   진짜 업무 메일(직접 온 고객 문의, 협력사 연락)을 놓친다. 놓치는 쪽이 훨씬 위험하므로,
   광고·뉴스레터로 확인된 발신자만 빼고 나머지는 남긴다.

   업무에서 의뢰를 뺄 때는 MATCH 만 뺀다. -(A -B) 같은 중첩 부정은 지메일 해석이 불확실하고,
   github 알림은 애초에 의뢰가 아니라 업무로 남는 것이 맞다.

   탭 사이 중복은 허용한다(결제 메일이 전체에도 나온다). 중복을 없애려고 쿼리를 더
   복잡하게 만들면 유지보수가 안 된다.

   ── 의뢰는 여기서 빠졌다 (대표 지시 2026-08-09
      "메일관리에서 홈페이지를 통해서 의뢰 온것들만 따로 메뉴만들어줘 따로 관리할수있게")

   의뢰는 돈이 되는 유일한 메일이다. 청구서·깃허브 알림과 같은 목록에 섞여 있으면 놓친다.
   그래서 왼쪽 메뉴에 [의뢰관리]로 따로 뺐고 여기에는 남기지 않는다.
   전체 탭에서도 뺀다 — 양쪽에 다 나오면 어디서 처리했는지 알 수 없게 되기 때문이다.
   결과적으로 메일관리는 전체(=결제+업무)·결제·업무 세 탭이다. */
var MAIL_TABS = [
  { key:"전체", q:"in:inbox " + MAIL_Q_JUNK + " -" + MAIL_Q_REQUEST_MATCH },
  { key:"결제", q:"in:inbox " + MAIL_Q_PAYMENT },
  { key:"업무", q:"in:inbox " + MAIL_Q_JUNK + " -" + MAIL_Q_REQUEST_MATCH + " -" + MAIL_Q_PAYMENT }
];

/* 의뢰관리 화면의 분류. 한 종류뿐이라 분류 칩 줄은 화면에서 숨는다(renderMailView).
   조건은 새로 쓰지 않고 MAIL_Q_REQUEST 를 그대로 쓴다 — 같은 뜻을 두 곳에 적으면
   반드시 한쪽만 고쳐져서 목록과 배지가 어긋난다. */
var INQUIRY_TABS = [
  { key:"의뢰", q:"in:inbox " + MAIL_Q_REQUEST }
];

/* 메일 계열 화면은 둘이고 렌더 코드는 한 벌을 공유한다(renderMailView).
   복사해 두면 다음에 한쪽만 고쳐져서 두 화면이 조용히 어긋난다.
   화면마다 다른 것은 ① 분류 탭 목록 ② 설명문 뿐이다. */
var MAIL_VIEWS = {
  mail: {
    tabs: MAIL_TABS,
    desc: "광고·뉴스레터와 <b>의뢰</b>를 뺀 지메일입니다. 의뢰는 왼쪽 <b>의뢰관리</b>에서 봅니다. " +
          "분류·기간·검색으로 좁혀 보고, 메일을 누르면 전문이 열리며 그 자리에서 회신할 수 있습니다."
  },
  inquiries: {
    tabs: INQUIRY_TABS,
    desc: "홈페이지 문의·견적 폼으로 들어온 <b>의뢰</b>만 모았습니다. " +
          "<b>메일</b> 탭은 받은 메일 전문과 회신, <b>리드 상세</b> 탭은 폼이 남긴 회사·담당자·예산·상태입니다."
  }
};

/* 화면 상태는 화면별로 따로 둔다 — 메일관리에서 3쪽을 보다가 의뢰관리로 갔는데

/* ── 의뢰관리의 두 얼굴 (대표 지시 2026-08-11)

   같은 의뢰가 두 곳에 흩어져 있었다. 들어온 "메일"은 의뢰관리에, 폼이 남긴
   "구조화된 정보"(회사·담당자·예산·희망일정·상태)는 리드 시트에 있었고 그것은
   홈페이지 메뉴 표에 묻혀 있었다. 의뢰를 실제로 관리하려면 한 화면에 있어야 한다.

   짝짓기는 하지 않는다 — 메일과 리드를 제목 문자열로 이으려면 반드시 깨진다.
   두 탭을 나란히 두는 것으로 충분하고, 그 이상은 수신부에 공통 키가 생긴 뒤의 일이다.
   기본은 메일이다(어제까지의 화면 그대로). 선택은 세션 동안 유지한다 — 리드를 보다가
   다른 메뉴에 다녀왔는데 메일로 되돌아가 있으면 매번 다시 눌러야 한다. */
var INQUIRY_PANES = [ { key:"mail", label:"메일" }, { key:"leads", label:"리드 상세" } ];
var inquiryPane = "mail";

function mailTabQuery(tabs, key){
  for (var i=0; i<tabs.length; i++) if (tabs[i].key === key) return tabs[i].q;
  return tabs[0].q;
}

/* ── 기간 (대표 지시 2026-08-09 — "최근 1주일치가 나오게 하고 그 이상이면 6개월치")

   기간은 반드시 "명시적 선택"이다. 마지막 페이지에서 몰래 6개월로 넓히는 식의 자동 확장은

   대표가 칩을 눌러야만 범위가 바뀌고, 바뀐 사실이 칩에 그대로 보인다. */
var MAIL_RANGES = [
  { key:"7d", label:"최근 1주일", q:"newer_than:7d" },
  { key:"6m", label:"최근 6개월", q:"newer_than:6m" }
];
function mailRangeQuery(key){
  for (var i=0; i<MAIL_RANGES.length; i++) if (MAIL_RANGES[i].key === key) return MAIL_RANGES[i].q;
  return MAIL_RANGES[0].q;
}

/* ── 검색어 (대표 지시 2026-08-09 — "코드형식 말고 선택형식으로 쉽게, 검색기능도")

   대표는 지메일 문법을 칠 이유가 없다. 화면에는 사람이 읽는 컨트롤(분류·기간·검색)만 두고,
   지메일 쿼리는 여기 mailBuildQuery 한 곳에서만 조립한다.

   입력값은 공백으로 쪼개 토큰마다 큰따옴표로 감싼다. 지메일은 따옴표 안을 리터럴로 보므로
   ( ) - OR : 같은 연산자가 섞여도 쿼리가 깨지지 않는다.
   따옴표 자체는 지메일에 이스케이프 문법이 없어서 제거한다(백슬래시도 함께).
   토큰을 각각 감싸는 이유: 통째로 한 구절로 묶으면 "김 대표"가 그 순서 그대로 붙어 있는
   메일만 걸린다. 사람이 검색창에 기대하는 것은 단어들의 AND 다. */
function mailSearchTerm(raw){
  var s = String(raw == null ? "" : raw).replace(/["\\]/g, " ").trim();
  if (!s) return "";
  var toks = s.split(/\s+/).filter(Boolean).slice(0, 8);
  if (!toks.length) return "";
  return toks.map(function(t){ return '"' + t.slice(0, 60) + '"'; }).join(" ");
}

/* 분류·기간·검색 → 실제 지메일 검색어. 쿼리를 만드는 곳은 여기 하나뿐이다(단일 출처).
   tabs 를 인자로 받는 이유는 메일관리와 의뢰관리가 이 함수를 같이 쓰기 때문이다. */
function mailBuildQuery(tabs, tab, range, search){
  var q = mailTabQuery(tabs, tab) + " " + mailRangeQuery(range);
  var s = mailSearchTerm(search);
  return s ? q + " " + s : q;
}

var MAIL_PAGE_SIZE = 20;   /* 대표 지시 — 한 페이지 20건 */

/* 화면 상태(탭·기간·검색·페이지·목록)는 위 mailUI 에 화면별로 들어 있다.
   전에는 여기 모듈 변수 한 벌이었는데, 화면이 둘이 되면서 그대로 두면 서로 덮어쓴다.

   페이징은 hasMore 로만 알 수 있다 — 전체 개수를 주는 API 가 없으므로 총 페이지 수를 모른다.

/* 요청 일련번호와 진행 중인 요청은 renderMailView 바깥(모듈 수준)에 둔다.
   renderMailView 안의 지역변수로 두면 화면을 다시 그릴 때 0으로 되돌아가서,
   앞 화면이 띄워 둔 응답이 늦게 도착했을 때 "최신"으로 오인된다.

   mailUI[화면].paging·page·maxPage 를 조용히 덮어써서 다음 그리기부터 페이저가 틀어진다.

   메일관리와 의뢰관리가 이 하나를 같이 쓰는 것은 의도한 것이다 — 화면을 옮기면
   앞 화면의 요청은 어차피 버려야 하고, seq 가 하나면 그 판정이 저절로 된다. */
var mailReqSeq = 0;
var mailAbort  = null;

function mailFetch(q, start, signal){
  if (!AUTH.user) return Promise.reject(new Error("로그인이 필요합니다."));
  return AUTH.user.getIdToken().then(function(token){
    return fetch(RECEIVER_URL+"?action=mail&q="+encodeURIComponent(q)+
      "&limit="+MAIL_PAGE_SIZE+"&start="+(start||0)+
      "&idToken="+encodeURIComponent(token)+"&t="+Date.now(), { cache:"no-store", signal: signal });
  }).then(function(r){ return r.json(); });
}
/* ── 사이드바 [의뢰관리] 배지 — 안 읽은 의뢰 개수
      (대표 지시 2026-08-09 "이쪽에 의뢰(문의) 메일이 들어오면, 표시해줘")

   의뢰는 돈이 되는 유일한 메일이라, 안 읽은 것이 있으면 메뉴에서 바로 보여야 한다.
   판정 조건은 새로 쓰지 않고 INQUIRY_TABS 의 쿼리를 그대로 쓴다 — 같은 뜻을 두 곳에
   적으면 반드시 한쪽만 고쳐져서 배지와 목록이 어긋난다.

   개수는 응답 mails.length 다 — 수신부에 총계 API 가 없으므로 없는 숫자를 지어내지 않는다.
   요청 limit 이 MAIL_PAGE_SIZE(20)라 20건이 꽉 차면 "더 있을 수 있다"는 뜻이므로 "20+" 로 적는다.

   ⚠️ 읽음 처리는 아직 없다. 수신부(Apps Script)에 markRead 액션이 필요한데 이번 범위 밖이다.
      지금은 대표가 지메일에서 읽으면 그때 반영된다(최대 5분). */

/* 갱신 간격 5분. 과제 2에서 요청과 재그리기를 줄여 놓고 배지가 도로 늘리면 본말전도라
   60초 시트 동기화 주기에는 얹지 않고 별도 타이머로 돈다. 의뢰는 하루 몇 건 단위여서
   5분 지연이 업무에 영향을 주지 않는다. */
var MAIL_BADGE_TTL = 5*60*1000;

var mailBadgeCount = 0;      /* 0 = 아무것도 안 보임. 모름·실패도 0으로 떨어뜨린다 */
var mailBadgeAt    = 0;
var mailBadgeBusy  = false;

function mailBadgeText(){
  if (!mailBadgeCount) return "";
  return mailBadgeCount >= MAIL_PAGE_SIZE ? (MAIL_PAGE_SIZE + "+") : String(mailBadgeCount);
}

/* 배지 숫자만 제자리에서 고친다. render()·buildNav() 를 부르지 않는다 —
   과제 2에서 없앤 깜박임을 배지가 되살리면 안 된다. */
function paintMailBadge(){
  var item = document.querySelector(".nav-item[href='#inquiries']");
  if (!item) return;
  var b = item.querySelector("[data-mail-badge]");
  var t = mailBadgeText();
  if (!t){ if (b) b.remove(); return; }
  if (!b){
    b = document.createElement("span");
    b.className = "soon badge";                 /* 준비중 칩과 같은 자리·같은 모양, 색만 다르다 */
    b.setAttribute("data-mail-badge", "");
    item.appendChild(b);
  }
  if (b.textContent !== t) b.textContent = t;
}

/* 수신부가 죽었거나 권한이 없으면 배지를 그냥 숨긴다 — 메뉴에 오류를 띄우지 않는다.
   오래된 숫자를 최신인 척 남겨두는 것이 제일 나쁘므로, 실패하면 이전 숫자를 지운다. */
function mailBadgeRefresh(force){
  if (window.__MOCK__ || !AUTH.user || !AUTH.isAdmin) return;
  if (document.hidden) return;                  /* 안 보는 탭에서는 요청하지 않는다 */
  if (mailBadgeBusy) return;
  if (!force && (Date.now() - mailBadgeAt) < MAIL_BADGE_TTL) return;
  mailBadgeBusy = true;
  mailBadgeAt = Date.now();                     /* 실패해도 갱신한다 — 죽은 수신부를 5분마다만 두드리게 */
  mailFetch(mailBadgeQuery(), 0).then(function(j){
    mailBadgeCount = (j && !j.error && Array.isArray(j.mails)) ? j.mails.length : 0;
    paintMailBadge();
  }).catch(function(){
    mailBadgeCount = 0; paintMailBadge();
  }).finally(function(){ mailBadgeBusy = false; });
}

/* 스레드 전문. 목록은 snippet 만 주므로 모달을 열 때 따로 받아온다. */
function mailBodyFetch(id){
  if (!AUTH.user) return Promise.reject(new Error("로그인이 필요합니다."));
  return AUTH.user.getIdToken().then(function(token){

      "&idToken="+encodeURIComponent(token)+"&t="+Date.now(), { cache:"no-store" });

}
/* 회신·미리보기는 POST — 본문이 길고, 쿼리에 남기면 안 된다.
   Content-Type 은 text/plain — Apps Script 웹앱은 CORS 프리플라이트를 처리하지 못한다
   (기존 apiSend 와 같은 방식). idToken 은 URL 이 아니라 본문에 담는다. */
function mailPost(payload){
  if (!AUTH.user) return Promise.reject(new Error("로그인이 필요합니다."));
  return AUTH.user.getIdToken().then(function(token){
    return fetch(RECEIVER_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ idToken: token }, payload))
    });
  }).then(function(r){ return r.text(); }).then(function(t){
    var j = null; try{ j = JSON.parse(t); }catch(e){}
    if (!j) throw new Error("서버 응답을 해석하지 못했습니다.");
    return j;
  });
}
function mailErrText(code){
  if (code === "forbidden" || code === "unauthorized") return "이 계정에는 메일 열람 권한이 없습니다. 대표 계정으로 로그인하십시오.";
  return String(code || "알 수 없는 오류");
}
function mailDateText(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return "";
  try{
    return new Intl.DateTimeFormat("ko-KR",{ timeZone:"Asia/Seoul", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" }).format(d);
  }catch(e){ return String(iso).slice(0,16).replace("T"," "); }
}
function mailSafeLink(u){ return /^https:\/\/mail\.google\.com\//.test(String(u||"")) ? String(u) : ""; }

/* ── 본문 렌더 — 남이 보낸 HTML 이다. 우리 문서에 절대 넣지 않는다.

   1) sandbox="" 인 iframe 안에서만 렌더한다. 빈 문자열이면 스크립트·폼·팝업·상위 접근이 전부 막힌다.
      allow-scripts 는 넣지 않는다 — 넣는 순간 <script> 와 onerror 가 살아난다.
   2) 문서 안에 CSP 를 한 겹 더 건다.

      ⚠️ 이미지는 허용하고 스크립트는 막는다. 둘은 성격이 다르다 (2026-08-09 대표 지시로 정정):
        - 스크립트 = 대시보드를 조작할 수 있는 **공격 통로**. 무조건 막는다.
        - 이미지   = 열람 사실이 발신자에게 알려지는 **프라이버시 문제**. 추적 픽셀은
                     광고·뉴스레터에 몰려 있는데 그건 이미 분류 필터로 걸러냈다. 남는 것은
                     청구서·깃허브·고객 메일이라 막아서 얻는 것보다 못 보는 손해가 크다.
      "이미지를 풀었으니 스크립트도 풀어도 되겠지"는 틀렸다. img-src 외에는 열지 말 것.

   3) srcdoc 은 속성 문자열이 아니라 프로퍼티로 대입한다 — 따옴표·& 이스케이프 실수가 원천적으로 없다. */
function mailFrameDoc(html){
  return "<!doctype html><html><head><meta charset='utf-8'>"+
    "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src https: data:;\">"+
    /* ⚠️ 여기에 스타일을 더 얹지 말 것. 메일 HTML 은 20년째 고정폭 테이블 레이아웃을 전제로
       만들어진다. 우리가 규칙을 하나 얹을 때마다 남의 메일이 그만큼 깨진다.
       아래 4줄이 남길 수 있는 최소치다 — 흰 배경, 기본 글꼴, 링크색, 링크 줄바꿈.

       뺀 것과 그 이유 (2026-08-09, 대표 보고 "메일이 깨진다" — 깃허브 Actions 알림 실측):
       · overflow-wrap:anywhere  ← 이번 깨짐의 진범.
           깃허브 알림의 표 머리글은 <th style="width:24px; padding:16px 0 16px 16px">Status</th> 다.
           보통은 "Status" 가 쪼개지지 않는 한 덩어리(min-content ≈ 44px)라 칸이 그만큼 벌어진다.
           그런데 anywhere 는 **min-content 를 글자 하나 폭으로 무너뜨린다**(break-word 와 다른 점).
           그래서 브라우저가 width:24px 를 그대로 지켜도 된다고 판단해 S/t/a/t/u/s 로 세워 버린다.
           같은 이유로 표의 모든 칸이 최소폭까지 눌려 레이아웃 전체가 찌그러졌다.
       · table{max-width:100%}   ← 메일이 지정한 고정폭을 우리가 무시하고 강제로 압축한다.
       · img{max-width:100%;height:auto} ← height:auto 는 height 속성을 덮어써서
           1x1 스페이서 gif(width=600 height=1)를 600px 높이로 부풀린다. 옛 템플릿이 통째로 무너진다.

       넘치면 줄이지 말고 가로로 스크롤하게 둔다 — 지메일도 넓은 메일은 가로로 민다.
       iframe 뷰포트는 기본으로 가로 스크롤되므로 따로 걸 것이 없다. */
    "<style>html{background:#fff;}"+
      "body{margin:0;padding:12px 14px;background:#fff;color:#141414;"+
      "font:14px/1.7 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;}"+
      /* 링크에만 좁게 건다. break-word 는 anywhere 와 달리 min-content 를 건드리지 않아
         표 폭을 무너뜨리지 않으면서 긴 URL 한 줄이 화면을 밀어내는 것만 막는다. */
      "a{color:#0b57d0;overflow-wrap:break-word;}</style>"+
    "</head><body>"+html+"</body></html>";
}
/* mailHasRemote() 는 이미지 차단 안내를 띄우던 함수. 이미지를 허용하면서 쓸 곳이 없어져 제거했다. */
/* sandbox 안에서는 높이를 알려줄 수 없다(스크립트가 막혀 있으므로).
   글자 수로 어림잡고, 넘치면 iframe 안에서 스크롤하게 둔다. */
function mailFrameHeight(src){
  var n = String(src||"").replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").length;
  return Math.max(220, Math.min(600, Math.round(120 + n * 0.7)));
}

/* 스레드 한 통. iframe 은 DOM 을 만든 뒤 JS 로 붙인다(위 3번 이유). */
function mailMessageNode(msg){
  var who  = String(msg.fromName||"").trim();
  var addr = String(msg.from||"");
  var node = el("<div class='mail-msg'>"+
    "<div class='mail-msg-h'><b>"+esc(who || addr)+"</b>"+
      (who && addr ? " <span class='em'>&lt;"+esc(addr)+"&gt;</span>" : "")+
      "<div class='em'>받는사람 "+esc(String(msg.to||"—"))+" · "+esc(mailDateText(msg.date))+"</div></div>"+
    "<div data-body></div></div>");
  var slot = node.querySelector("[data-body]");
  var html = String(msg.html||"");
  if (html){
    var f = document.createElement("iframe");
    f.setAttribute("sandbox", "");                 /* allow-scripts 를 넣지 말 것 */
    f.setAttribute("referrerpolicy", "no-referrer");
    f.style.height = mailFrameHeight(html) + "px";
    f.srcdoc = mailFrameDoc(html);
    slot.appendChild(f);
    /* 차단 안내는 뺐다 — 이미지를 허용했으므로 이제 사실이 아니다. 화면이 거짓말하면 안 된다. */
  } else {
    /* 평문. 링크 자동변환은 하지 않는다 — 요청에 없던 기능이고, 평문은 그대로 보여주는 쪽이 정직하다. */
    slot.appendChild(el("<div style=\"padding:12px 14px; white-space:pre-wrap; font-size:13.5px; line-height:1.75\">"+
      esc(String(msg.text||"") || "(본문이 없습니다)")+"</div>"));
  }
  if (msg.truncated) slot.appendChild(el("<div class='mail-warn'>본문이 길어 잘렸습니다. 전문은 지메일에서 열어 확인하십시오.</div>"));
  return node;
}

/* ── 본문 팝업. 기존 .modal-bg / .modal / .modal-h / .modal-b / .modal-f 를 그대로 쓴다. */
function mailOpenModal(m, idx){
  var link = mailSafeLink(m.link);
  var bg = el("<div class='modal-bg mail-modal-bg' style='z-index:9999'>"+
    "<div class='modal mail-modal' style='max-width:860px; width:96%'>"+
      "<div class='modal-h'>"+
        "<h3 style='flex:1; min-width:0; padding-right:10px'>"+esc(m.subject||"(제목 없음)")+"</h3>"+
        "<div style='display:flex; gap:6px; align-items:center; flex:none'>"+
          (link ? "<a class='btn sm' style='text-decoration:none' href='"+esc(link)+"' target='_blank' rel='noopener noreferrer'>지메일에서 열기</a>" : "")+
          "<button type='button' class='icon-btn' data-mail-x>✕</button></div>"+
      "</div>"+
      "<div class='modal-b' style='max-height:74vh; gap:16px'>"+
        "<div data-mail-thread><div class='empty' style='padding:26px 12px'>본문을 불러오는 중…</div></div>"+
        "<div style='border-top:1px solid var(--line); padding-top:14px'>"+mailComposerHTML(m, idx)+"</div>"+
      "</div>"+
      "<div class='modal-f'><button type='button' class='btn ghost' data-mail-cancel='"+idx+"'>닫기</button></div>"+
    "</div></div>");

  document.body.style.overflow = "hidden";          /* 열려 있는 동안 배경 스크롤 잠금 */
  var closed = false;
  function close(){
    if (closed) return; closed = true;
    document.removeEventListener("keydown", onKey, true);
    bg.remove();
    /* 잠금 해제는 "열려 있던 값 복원"이 아니라 "남은 모달이 없을 때만 해제"다.
       열린 채로 또 열리면 복원 방식은 hidden 을 hidden 으로 되돌려 영구히 잠긴다. */
    if (!document.querySelector(".modal-bg")) document.body.style.overflow = "";
  }
  function onKey(e){ if (e.key === "Escape"){ e.stopPropagation(); close(); } }
  document.addEventListener("keydown", onKey, true);
  bg.querySelector("[data-mail-x]").onclick = close;
  bg.onclick = function(e){ if (e.target === bg) close(); };   /* 배경 클릭 */

  document.body.appendChild(bg);
  bindMailComposer(bg, m, idx, close);

  var slot = bg.querySelector("[data-mail-thread]");
  mailBodyFetch(String(m.id||"")).then(function(j){
    if (closed) return;
    if (!j || j.error || !j.messages){
      /* 수신부가 아직 mailBody 를 안 내놓았거나 스레드를 못 찾은 경우.
         목록에 이미 있는 snippet 이라도 보여주고, 못 가져왔다는 사실을 밝힌다. */
      slot.innerHTML = "";
      slot.appendChild(el("<div class='mail-msg'><div class='mail-msg-h'><b>"+
        esc(String(m.fromName||"").trim() || String(m.from||""))+"</b><div class='em'>"+
        esc(mailDateText(m.date))+"</div></div>"+
        "<div style='padding:12px 14px; white-space:pre-wrap; font-size:13.5px; line-height:1.75'>"+
        esc(m.snippet||"")+"</div>"+
        "<div class='mail-warn'>본문 전문을 불러오지 못했습니다 ("+esc(mailErrText(j && j.error))+"). 위는 목록 미리보기입니다.</div></div>"));
      return;
    }
    slot.innerHTML = "";
    if (j.omitted) slot.appendChild(el("<div class='mail-warn' style='border:1px solid var(--line); border-radius:10px; margin-bottom:12px'>"+
      "이전 메시지 "+esc(String(j.omitted))+"통은 생략했습니다. 전문은 지메일에서 열어 확인하십시오.</div>"));
    (j.messages||[]).forEach(function(msg){ slot.appendChild(mailMessageNode(msg)); });   /* 오래된 → 최신 */
    if (!(j.messages||[]).length) slot.appendChild(el("<div class='empty'>본문이 없습니다.</div>"));
  }).catch(function(err){
    if (closed) return;
    slot.innerHTML = "<div class='empty'>본문을 불러오지 못했습니다. "+esc(mailErrText(err && err.message || err))+"</div>";
  });
}

/* 회신 UI 배선. root 는 모달(또는 회신 컨트롤을 담은 컨테이너), onClose 는 닫기 동작 */
function bindMailComposer(root, m, idx, onClose){
  var ta     = root.querySelector("[data-mail-text='"+idx+"']");
  var prevBt = root.querySelector("[data-mail-prev='"+idx+"']");
  var sendBt = root.querySelector("[data-mail-send='"+idx+"']");
  var cancBt = root.querySelector("[data-mail-cancel='"+idx+"']");
  var stat   = root.querySelector("[data-mail-status='"+idx+"']");
  var box    = root.querySelector("[data-mail-prevbox='"+idx+"']");
  var tid    = String(m.id||"");
  if (!ta) return;

  ta.value = mailDrafts[tid] || "";

  function say(msg, tone){
    stat.textContent = msg;
    stat.style.color = tone==="ok" ? "var(--accent)" : tone==="err" ? "var(--urgent)" : "var(--ink-3)";
  }
  /* 본문이 미리보기 때와 다르면 보내기를 막는다 — 확인하지 않은 메일은 나가지 않는다 */
  function syncSend(){
    var ok = ta.value.trim() && mailPreviewed[tid] === ta.value;
    sendBt.disabled = !ok;
  }
  ta.oninput = function(){
    mailDrafts[tid] = ta.value;
    if (mailPreviewed[tid] !== ta.value){
      box.innerHTML = "";
      say("본문이 바뀌었습니다. 다시 미리보기로 확인하십시오.");
    }
    syncSend();
  };

  prevBt.onclick = function(){
    if (!ta.value.trim()){ say("본문이 비어 있습니다.", "err"); return; }
    var want = ta.value;
    prevBt.disabled = true; say("미리보기를 만드는 중…");
    mailPost({ action:"mailPreview", bodyText: want }).then(function(j){
      prevBt.disabled = false;
      if (!j.ok || j.error){ say(mailErrText(j.error), "err"); return; }
      mailPreviewed[tid] = want;
      var frame = document.createElement("iframe");
      frame.setAttribute("sandbox", "");                       /* 미리보기 안에서 스크립트가 돌지 않게 */
      frame.style.cssText = "width:100%; height:440px; border:1px solid var(--line-strong); border-radius:10px; background:#141414";
      /* 감싸는 부분은 미리보기용 여백·인코딩 정리일 뿐, 실제로 나가는 본문은 j.html 그대로다 */
      frame.srcdoc = "<meta charset='utf-8'><body style='margin:0;background:#141414'>" + j.html + "</body>";
      box.innerHTML = "";
      box.appendChild(frame);
      say("실제로 나갈 메일입니다. 확인 후 보내기를 누르십시오.", "ok");
      syncSend();
    }).catch(function(err){
      prevBt.disabled = false;
      say(mailErrText(err && err.message || err), "err");
    });
  };

  sendBt.onclick = function(){
    var want = ta.value;
    if (mailPreviewed[tid] !== want){ say("미리보기로 확인한 본문과 다릅니다.", "err"); syncSend(); return; }
    sendBt.disabled = true; prevBt.disabled = true; ta.disabled = true;
    say("보내는 중…");
    mailPost({ action:"mailReply", threadId: tid, bodyText: want }).then(function(j){
      prevBt.disabled = false; ta.disabled = false;
      if (!j.ok || j.error){ say(mailErrText(j.error), "err"); syncSend(); return; }   /* 본문은 그대로 둔다 */
      delete mailDrafts[tid]; delete mailPreviewed[tid];
      ta.value = ""; box.innerHTML = "";
      sendBt.disabled = true;
      say("회신을 보냈습니다.", "ok");
    }).catch(function(err){
      prevBt.disabled = false; ta.disabled = false;
      say(mailErrText(err && err.message || err), "err");                              /* 작성한 본문 유지 */
      syncSend();
    });
  };

  if (cancBt) cancBt.onclick = function(){ if (onClose) onClose(); };
  syncSend();
}

/* 페이지 번호 — 총 개수를 주는 API 가 없으므로 "확인된 만큼"만 그린다.
   s.maxPage 는 존재가 확인된 가장 큰 번호이고, hasMore 면 다음 하나를 더 보여준다.
   s = mailUI[화면] 상태. 메일관리와 의뢰관리가 같이 쓰므로 모듈 변수 대신 인자로 받는다. */
function mailPagerHTML(s){
  if (!s.paging) return "";                           /* 옛 응답(hasMore 없음) → 페이징을 숨긴다 */
  var last = Math.max(s.maxPage, s.page + (s.hasMore ? 1 : 0));
  if (last <= 1) return "";
  var nums = [];
  if (last <= 9){ for (var i=1; i<=last; i++) nums.push(i); }
  else {
    nums.push(1);
    for (var k=s.page-1; k<=s.page+1; k++) if (k>1 && k<last) nums.push(k);
    nums.push(last);
    nums = nums.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(function(a,b){ return a-b; });
  }
  var h = "<button class='pg' data-mail-pg='"+(s.page-1)+"'"+(s.page<=1?" disabled":"")+">‹ 이전</button>";
  var prev = 0;
  nums.forEach(function(n){
    if (prev && n > prev+1) h += "<span class='gap'>…</span>";
    h += "<button class='pg"+(n===s.page?" on":"")+"' data-mail-pg='"+n+"'>"+n+"</button>";
    prev = n;
  });
  h += "<button class='pg' data-mail-pg='"+(s.page+1)+"'"+(s.hasMore?"":" disabled")+">다음 ›</button>";
  return h;
}

/* 메일관리와 의뢰관리가 같이 쓰는 렌더 함수 (대표 지시 2026-08-09).
   view = "mail" | "inquiries". 다른 것은 분류 탭 목록과 설명문뿐이고,
   기간·페이징·검색·본문 팝업·회신은 전부 이 한 벌을 공유한다.
   복사본을 만들면 다음에 한쪽만 고쳐져서 두 화면이 조용히 어긋난다. */
function renderMailView(view){
  var V = MAIL_VIEWS[view] || MAIL_VIEWS.mail;
  var s = mailUI[view] || mailUI.mail;
  var isInquiry = (view === "inquiries");
  /* 설명문은 화면이 하는 일을 그대로 말한다 — 받은편지함 전부가 아니라 걸러서 보여준다.
     "받은편지함을 읽어옵니다"로 두면 안 보이는 메일이 없다고 오해한다. */
  var html = pageHead(view, V.desc, "");
  if (!AUTH.isAdmin){
    html += "<section class='panel' style='background:transparent;border:0;box-shadow:none'>"+
      "<div class='placeholder'><div class='ico'>🔒</div><h3>권한 없음</h3>"+
      "<p>"+(isInquiry?"의뢰관리":"메일관리")+"는 대표 계정(어드민)만 열람할 수 있습니다.</p></div></section>";
    C.innerHTML = html;
    return;
  }
  /* 의뢰관리의 탭 줄. 새 컴포넌트를 만들지 않고 분류 칩(.proj-chips/.proj-chip)을 그대로 쓴다.
     두 화면(pane)을 한 번에 그려 두고 보이기만 바꾼다 — 탭을 누를 때마다 다시 그리면
     메일 목록을 매번 새로 받게 되고, 그건 어제 잡은 성능 회귀를 그대로 되돌리는 짓이다. */
  if (isInquiry){
    html += "<div class='proj-chips' data-inq-tabs style='margin-bottom:16px'></div>";
  }
  html += "<div data-inq-pane='mail'>";
  /* 화면에는 사람이 읽는 컨트롤만 둔다(대표 지시 2026-08-09).
     지메일 쿼리 원문은 "고급"에 접어 두되 없애지는 않는다 —
     무엇을 보고 있는지 확인하고 싶을 때 확인할 수 있어야 한다. */
  html += "<section class='panel'>"+
      "<div class='mail-filters'>"+
        /* 의뢰관리는 분류가 하나뿐이라 칩 줄을 아예 그리지 않는다 —
           선택지가 하나인 컨트롤은 화면만 어지럽힌다. */
        (V.tabs.length > 1
          ? "<div class='mail-frow'><span class='mail-flabel'>분류</span><div class='proj-chips' data-mail-tabs></div></div>"
          : "")+
        "<div class='mail-frow'><span class='mail-flabel'>기간</span><div class='proj-chips' data-mail-ranges></div></div>"+
        "<div class='mail-frow'><span class='mail-flabel'>검색</span>"+
          "<div class='mail-search'>"+
            "<input class='proj-search' type='search' placeholder='이름·회사·제목으로 검색' data-mail-q>"+
            "<button class='btn' data-mail-go>검색</button>"+
            "<button class='btn sm ghost' data-mail-clear>지우기</button>"+
            "<button class='btn sm ghost' data-mail-reload>새로고침</button>"+
          "</div></div>"+
      "</div>"+
      "<details class='mail-adv'><summary>고급 · 실제 지메일 검색어</summary><code data-mail-raw></code></details>"+
    "</section>";
  html += "<section class='panel'>"+
      "<div class='mail-note' data-mail-note></div>"+
      "<div class='tbl-scroll mail-body' data-mail-body><div class='empty'>메일을 불러오는 중…</div></div>"+
      "<div class='mail-pager' data-mail-pager style='display:none'></div>"+
    "</section>";
  html += "</div>";
  /* 리드 상세 — 홈페이지 메뉴에 있던 그 표 그대로다(hpFetchLeads + hpLeadsHTML).
     새 수신 함수도 새 표 렌더러도 만들지 않는다. 같은 데이터를 두 가지 모양으로
     그리기 시작하면 어느 쪽이 맞는지 아무도 모르게 된다. */
  if (isInquiry){
    html += "<div data-inq-pane='leads' style='display:none'>"+
      "<section class='panel'><div class='sec-head'><div><div class='eyebrow'>리드</div>"+
      "<h3>폼으로 들어온 의뢰 정보</h3></div><div class='sec-note'>최근 20건 · 견적·문의 폼</div></div>"+
      "<div class='tbl-scroll' data-inq-leads><div class='empty'>리드를 불러오는 중…</div></div>"+
      "</section></div>";
  }
  C.innerHTML = html;

  var qEl     = C.querySelector("[data-mail-q]");
  var tabsEl  = C.querySelector("[data-mail-tabs]");
  var rangeEl = C.querySelector("[data-mail-ranges]");
  var rawEl   = C.querySelector("[data-mail-raw]");
  var noteEl  = C.querySelector("[data-mail-note]");
  var bodyEl  = C.querySelector("[data-mail-body]");
  var pagerEl = C.querySelector("[data-mail-pager]");
  qEl.value = s.search;

  /* 검색은 [검색] 버튼·Enter·×(clear) 에서만 나간다. 입력 이벤트에는 붙이지 않는다 —
     한 글자마다 요청하면 스무 글자에 스무 번이고, 수신부는 Apps Script 무료 할당량이다.
     디바운스로 줄이는 방법도 있지만, 대표가 다 치고 나서 누르는 편이 요청 수도 적고
     "지금 무엇을 검색한 것인지"도 분명하다. */

  function drawChips(){
    if (tabsEl){                                  /* 의뢰관리에는 분류 줄이 없다 */
      tabsEl.innerHTML = V.tabs.map(function(t){
        return "<button class='proj-chip"+(t.key===s.tab?" on":"")+"' data-mail-tab='"+esc(t.key)+"'>"+esc(t.key)+"</button>";
      }).join("");
      tabsEl.querySelectorAll("[data-mail-tab]").forEach(function(b){
        /* 조건이 바뀌면 페이지도 "아는 것"도 전부 초기화한다.
           앞 조건에서 3쪽까지 봤다는 사실은 새 조건과 아무 관계가 없다 —
           남겨 두면 있지도 않은 페이지 번호를 그리게 된다. */
        b.onclick = function(){ s.tab = b.getAttribute("data-mail-tab"); s.page = 1; s.maxPage = 1; refresh(); };
      });
    }
    rangeEl.innerHTML = MAIL_RANGES.map(function(r){
      return "<button class='proj-chip"+(r.key===s.range?" on":"")+"' data-mail-range='"+esc(r.key)+"'>"+esc(r.label)+"</button>";
    }).join("");
    rangeEl.querySelectorAll("[data-mail-range]").forEach(function(b){
      /* 기간을 바꾸면 1페이지로 — 3페이지에서 범위만 바뀌면 무엇을 보는지 알 수 없다 */
      b.onclick = function(){ s.range = b.getAttribute("data-mail-range"); s.page = 1; s.maxPage = 1; refresh(); };
    });
    rawEl.textContent = mailBuildQuery(V.tabs, s.tab, s.range, s.search);
  }

  function drawPager(){
    var h = mailPagerHTML(s);
    pagerEl.style.display = h ? "" : "none";
    pagerEl.innerHTML = h;
    pagerEl.querySelectorAll("[data-mail-pg]").forEach(function(b){
      b.onclick = function(){
        var n = parseInt(b.getAttribute("data-mail-pg"), 10);
        if (!n || n < 1 || n === s.page) return;
        s.page = n; load();
      };
    });
  }

  function paintRows(list){
    bodyEl.innerHTML = mailRowsHTML(list);
    (list||[]).forEach(function(m, i){
      var tr = bodyEl.querySelector("[data-mail-row='"+i+"']");
      if (tr) tr.onclick = function(){ mailOpenModal(m, i); };
    });
  }

  function load(){
    var q = mailBuildQuery(V.tabs, s.tab, s.range, s.search);
    var seq = ++mailReqSeq;
    /* 동시 요청은 1건만 둔다 — 새 조건이 오면 앞 요청을 끊는다.
       (수신부의 실행까지 취소되지는 않는다. 브라우저 연결과 응답 처리를 정리하는 것이 목적이고,
        늦은 응답을 버리는 판정은 아래 seq 비교가 한다.) */
    if (mailAbort) mailAbort.abort();
    var ac = new AbortController();
    mailAbort = ac;
    var start = (s.page - 1) * MAIL_PAGE_SIZE;
    /* 페이지를 옮기는 중에는 목록을 지우지 않는다 — 화면이 비면 답답하다. 흐리게만 한다. */
    var first = !bodyEl.querySelector("[data-mail-row]");
    if (first) bodyEl.innerHTML = "<div class='empty'>메일을 불러오는 중…</div>";
    else bodyEl.classList.add("busy");
    noteEl.textContent = "불러오는 중…";
    rawEl.textContent = q;

    mailFetch(q, start, ac.signal).then(function(j){
      if (curRoute() !== view || seq !== mailReqSeq) return;   /* 화면을 떠났거나 조건이 바뀌었으면 폐기 */
      mailAbort = null;
      bodyEl.classList.remove("busy");
      if (!j || j.error){
        noteEl.textContent = "";
        bodyEl.innerHTML = "<div class='empty'>메일을 불러오지 못했습니다. "+esc(mailErrText(j && j.error))+"</div>";
        s.paging = false; drawPager(); return;
      }
      s.list = j.mails || [];
      /* hasMore 를 주지 않는 옛 응답이면 페이징 자체를 숨긴다 — 있지도 않은 페이지를 그리지 않기 위해 */
      s.paging = (typeof j.hasMore === "boolean");
      s.hasMore = s.paging && j.hasMore;
      if (!s.paging){ s.page = 1; s.maxPage = 1; }
      else s.maxPage = Math.max(s.maxPage, s.page + (s.hasMore ? 1 : 0));
      paintRows(s.list);
      drawPager();
      var rangeLabel = "";
      MAIL_RANGES.forEach(function(r){ if (r.key === s.range) rangeLabel = r.label; });
      noteEl.textContent = s.tab + " · " + rangeLabel +
        (s.search.trim() ? " · 검색 “" + s.search.trim() + "”" : "") +
        " · " + s.list.length + "건" + (s.paging ? " (" + s.page + "쪽)" : "");
      /* 의뢰 목록을 방금 받았으니 배지 숫자도 같은 시점으로 맞춘다.
         TTL 안이면 mailBadgeRefresh 가 스스로 걸러서 요청을 내지 않는다(화면도 다시 그리지 않는다). */
      if (isInquiry) mailBadgeRefresh();
    }).catch(function(err){
      if (curRoute() !== view || seq !== mailReqSeq) return;   /* 끊긴 앞 요청(AbortError)도 여기서 걸러진다 */
      mailAbort = null;
      bodyEl.classList.remove("busy");
      noteEl.textContent = "";
      bodyEl.innerHTML = "<div class='empty'>메일을 불러오지 못했습니다. "+esc(mailErrText(err && err.message || err))+"</div>";
    });
  }
  function refresh(){ drawChips(); load(); }

  function applySearch(){
    var v = (qEl.value||"");
    if (v === s.search) { refresh(); return; }
    s.search = v;
    s.page = 1; s.maxPage = 1;        /* 검색어가 바뀌면 1페이지부터 */
    refresh();
  }
  C.querySelector("[data-mail-go]").onclick = applySearch;
  C.querySelector("[data-mail-reload]").onclick = function(){ refresh(); };
  C.querySelector("[data-mail-clear]").onclick = function(){
    qEl.value = ""; s.search = ""; s.page = 1; s.maxPage = 1; refresh();
  };
  qEl.onkeydown = function(e){ if (e.key === "Enter"){ e.preventDefault(); applySearch(); } };
  qEl.onsearch = applySearch;   /* type=search 의 × 로 지웠을 때도 반영 */

  if (isInquiry) wireInquiryPanes();

  /* 탭 전환은 보이기만 바꾼다. 리드는 처음 열 때 한 번만 받고, 그 뒤로는
     hpFetchLeads 의 캐시(HP_TTL)가 받는다 — 오가는 동안 요청이 나가지 않는다.
     실패해도 "받아 봤다"로 표시해 둔다. 안 그러면 수신부가 죽어 있을 때
     탭을 누를 때마다 요청이 나간다. 다시 시도하려면 화면을 다시 열면 된다. */
  function wireInquiryPanes(){
    var tabsRow  = C.querySelector("[data-inq-tabs]");
    var paneMail = C.querySelector("[data-inq-pane='mail']");
    var paneLead = C.querySelector("[data-inq-pane='leads']");
    var leadBox  = C.querySelector("[data-inq-leads]");
    var leadsTried = false;

    function loadLeads(){
      leadsTried = true;
      hpFetchLeads().then(function(rows){
        if (curRoute() !== view || !leadBox.isConnected) return;   /* 화면을 떠났으면 그리지 않음 */
        if (rows === "unauthorized") return;                       /* 키 게이트가 이미 떴음 */
        /* 리드를 못 받아도 메일 탭은 멀쩡하다 — 안내는 이 탭 안에만 그린다 */
        leadBox.innerHTML = rows
          ? hpLeadsHTML(rows)
          : "<div class='empty'>리드 데이터를 받지 못했습니다. 수신부 연결 후 표시됩니다. (메일 탭은 그대로 쓸 수 있습니다)</div>";
        applyMask();
      });
    }
    function showPane(k){
      inquiryPane = k;
      paneMail.style.display = (k === "mail")  ? "" : "none";
      paneLead.style.display = (k === "leads") ? "" : "none";
      tabsRow.querySelectorAll("[data-inq-pane-btn]").forEach(function(b){
        b.classList.toggle("on", b.getAttribute("data-inq-pane-btn") === k);
      });
      if (k === "leads" && !leadsTried) loadLeads();
    }
    tabsRow.innerHTML = INQUIRY_PANES.map(function(p){
      return "<button class='proj-chip' data-inq-pane-btn='"+p.key+"'>"+esc(p.label)+"</button>";
    }).join("");
    tabsRow.querySelectorAll("[data-inq-pane-btn]").forEach(function(b){
      b.onclick = function(){ showPane(b.getAttribute("data-inq-pane-btn")); };
    });
    showPane(inquiryPane);
  }

  s.page = 1; s.maxPage = 1;
  refresh();
}

/* 마스터 키 오류 화면 — 금고(config/portal)의 키를 수신부(GAS)가 거부했을 때.
   키 수동 입력 게이트는 제거됨 — 어드민만 여기서 새 키를 금고에 재등록할 수 있다. */
function renderKeyGate(){
  var msg = state.keyError ? esc(state.keyError) : "접속 키를 확인할 수 없습니다.";
  if (!AUTH.isAdmin){
    C.innerHTML = "<div class='placeholder' style='margin:40px auto;max-width:460px'>"+
      "<div class='ico'>🔑</div><h3>접속 키 오류</h3>"+
      "<p>"+msg+"<br>금고에 저장된 마스터 키가 만료된 것 같습니다. 관리자(대표)에게 문의하십시오.</p></div>";
    return;
  }
  C.innerHTML = "<div class='placeholder' style='margin:40px auto;max-width:460px'>"+
    "<div class='ico'>🔑</div><h3>마스터 키 재등록</h3>"+
    "<p style='margin-bottom:18px'>"+msg+"<br>새 키를 입력하면 금고(config/portal)에 저장되고, 1·2등급 전원에게 적용됩니다.</p>"+
    "<div class='fld' style='max-width:320px;margin:0 auto;text-align:left'>"+
    "<label for='keyGateInput'>마스터 키</label>"+
    "<input id='keyGateInput' type='password' autocomplete='off' spellcheck='false' placeholder='접속 키 붙여넣기'>"+
    "</div>"+
    "<div style='margin-top:16px'><button class='btn primary' id='keyGateBtn'>등록 후 접속</button></div>"+
    "</div>";
  var inp = C.querySelector("#keyGateInput");
  var btn = C.querySelector("#keyGateBtn");
  function submit(){
    var v = (inp.value||"").trim();
    if (!v){ inp.focus(); return; }
    btn.disabled = true;
    saveMasterKey(v).then(function(){
      setKey(v);
      state.keyError = null; state.error = null; state.loading = true;
      render();
      loadData().then(render).catch(function(e){
        state.loading = false; state.error = e.message; render();
      });
    }).catch(function(e){
      btn.disabled = false;
      alert("금고 저장 실패: " + (e && e.message || e));
    });
  }
  btn.onclick = submit;
  inp.onkeydown = function(e){ if (e.key === "Enter"){ e.preventDefault(); submit(); } };
  inp.focus();
}

function render(){
  var route = curRoute();
  buildNav();
  updateSyncNote();
  C.classList.toggle("crm-wide", route==="projects");
  var tb = document.querySelector(".tb-title"); if(tb) tb.textContent = TITLES[route]||"애플시드";
  if (!KEY && !window.__MOCK__){ renderKeyGate(); return; }
  if (state.loading){ C.innerHTML = "<div class='empty' style='padding:80px 20px'>데이터를 불러오는 중…</div>"; return; }
  if (state.error){
    C.innerHTML = "<div class='placeholder' style='margin:40px auto;max-width:520px'><div class='ico'>⚠️</div><h3>데이터를 불러오지 못했습니다</h3><p style='margin-bottom:16px;'>"+esc(state.error)+"</p><button class='btn primary' id='resetKeyRetryBtn'>🔄 접속 키 초기화 및 재접속</button></div>";
    var btn = C.querySelector("#resetKeyRetryBtn");
    if (btn){
      btn.onclick = function(){
        clearKey();
        location.href = location.pathname;
      };
    }
    return;
  }
  var placeholder = false;
  MENU.forEach(function(g){ g.items.forEach(function(it){ if(it[0]===route && it[3]) placeholder=true; }); });
  if (placeholder || !ROUTES[route]) renderPlaceholder(route);
  else ROUTES[route]();
  applyMask();
  document.body.classList.remove("nav-open");
}

   대시보드 구동은 로그인 게이트가 접근을 확인한 뒤 startDashboard()로 시작한다. */
(function initTheme(){
  var savedTheme = localStorage.getItem("appleseed_theme") || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);
})();

var dashStarted = false;
function startDashboard(){
  if (!dashStarted){
    dashStarted = true;
    /* 데이터 자동 동기화: 1분마다 서버 기준으로 갱신 (탭이 보이고 로그인돼 있을 때만) —
       다른 기기·Claude가 바꾼 내용이 화면에 오래 남아있지 않게 함 */
    setInterval(function(){
      if (!document.hidden && KEY){
        state.refreshing = true; updateSyncNote();
        loadData().then(function(){
          state.refreshing = false;
          /* 여기서 무조건 render() 를 태우던 것이 "정신없음"의 근본이었다.
             render() 는 화면을 통째로 다시 만들기 때문에, 대표가 읽고 있는 목록이
             1분마다 사라졌다 돌아오고, 보던 페이지·스크롤이 처음으로 되돌아가고,
             자기 데이터를 따로 받는 화면(메일·홈페이지 유입 등)은 그때마다 요청을 새로 냈다.
             (홈페이지 유입은 이것 때문에 3분에 6건이 더 나갔다 — 실측 10건 vs 4건.)

             이제 두 가지를 보고 판단한다 — 자세한 근거는 SELF_FETCH_ROUTES 선언부 주석에.
               ① 이 화면의 출처가 관리시트인가
               ② 관리시트가 실제로 바뀌었는가
             아니면 사이드바 "마지막 갱신"만 조용히 고친다. 동기화는 그대로 돌기 때문에
             다른 기기·Claude 가 바꾼 내용은 다음에 그릴 때 이미 반영돼 있다. */
          var changed = (dataFingerprint() !== lastDataFp);
          markDataSeen();
          if (!changed || SELF_FETCH_ROUTES[curRoute()]){ updateSyncNote(); return; }
          render();
        })
                  .catch(function(){ state.refreshing=false; state.refreshFailed=true; updateSyncNote(); });
      }
    }, 60000);

    /* 안 읽은 의뢰 배지는 별도 타이머로 5분마다 — 위 60초 주기에 얹지 않는다.
       근거는 MAIL_BADGE_TTL 선언부 주석. mailBadgeRefresh() 안에서 document.hidden 과
       TTL 을 다시 확인하므로 탭이 숨겨져 있으면 요청이 나가지 않는다. */
    setInterval(function(){ mailBadgeRefresh(); }, MAIL_BADGE_TTL);
  }
  buildNav();
  /* 캐시가 있으면 먼저 그린다 — GAS 응답을 기다리는 1~4초 동안 빈 화면을 보여주지 않는다.
     캐시는 어디까지나 지난번 것이므로 갱신 상태를 사이드바에 계속 띄운다. */
  var cached = readDataCache();
  if (cached){
    state.data = cached.data;
    if (state.data && !Array.isArray(state.data.atts)) state.data.atts = [];
    state.cachedAt = cached.savedAt;
    state.fromCache = true;
    state.loading = false;
    state.refreshing = true;
  }
  render();
  (async function(){
    try{ await loadData(); }
    catch(e){
      /* 갱신 실패 — 캐시는 지우지 않는다. 대신 언제 것인지 명시한다 */
      if (state.fromCache){ state.refreshFailed = true; state.loading = false; }
      else { state.loading=false; state.error=e.message; }
    }
    state.refreshing = false;
    markDataSeen();               /* 최초 로드분을 기준선으로 — 첫 주기가 헛돌지 않게 */
    render();
  })();
  mailBadgeRefresh(true);         /* 로그인 직후 1회. 그 뒤는 위 5분 타이머만 */
}

  fbAuth.signInWithEmailLink(savedEmail, location.href).then(function(){
    localStorage.removeItem("emailForSignIn");
    history.replaceState(null, "", location.pathname);  /* URL의 로그인 링크 파라미터 제거 */
    emailLinkPending = false;
  }).catch(function(err){
    emailLinkPending = false;
    agShow("agLogin");
    document.getElementById("agLoginErr").textContent = "이메일 링크 로그인 실패: " + (err && err.message || err);
  });
}

var lastLinkEmail = "";
function agSendLink(email){
  email = String(email || "").trim();
  var errBox = document.getElementById("agLoginErr");
  errBox.textContent = "";
  if (!email){ document.getElementById("agEmailInput").focus(); return; }
  fbAuth.sendSignInLinkToEmail(email, {
    url: location.origin + location.pathname,
    handleCodeInApp: true
  }).then(function(){
    lastLinkEmail = email;
    localStorage.setItem("emailForSignIn", email);
    document.getElementById("agEmailSentTo").textContent = email;
    document.getElementById("agLoginMain").classList.add("hidden");
    document.getElementById("agEmailSent").classList.remove("hidden");
  }).catch(function(err){
    errBox.textContent = "링크 발송 실패: " + (err && err.message || err);
  });
}
document.getElementById("agEmailBtn").onclick = function(){
  agSendLink(document.getElementById("agEmailInput").value);
};
document.getElementById("agEmailResend").onclick = function(){ agSendLink(lastLinkEmail); };

function agShow(id){
  document.getElementById("authGate").classList.remove("hidden");
  ["agLoading","agLogin","agPending","agDenied","agMaster"].forEach(function(v){
    document.getElementById(v).classList.toggle("hidden", v !== id);
  });
}
function agHide(){ document.getElementById("authGate").classList.add("hidden"); }

function agDenied(title, msgHtml, withPortalLink){
  document.getElementById("agDeniedTitle").textContent = title;
  document.getElementById("agDeniedMsg").innerHTML = msgHtml;
  document.getElementById("agDeniedActions").innerHTML =
    (withPortalLink ? "<a class='btn primary' href='admin.html' style='text-decoration:none'>관리 포털 열기</a>" : "")+
    "<button class='btn' id='agDeniedLogout'>로그아웃</button>";
  document.getElementById("agDeniedLogout").onclick = function(){ fbAuth.signOut(); };
  agShow("agDenied");
}

/* 금고에 마스터 키 저장 — 규칙상 어드민만 쓸 수 있다 */
function saveMasterKey(v){
  return fbDb.collection("config").doc("portal").set(
    { masterKey: v, updatedAt: new Date().toISOString() }, { merge: true });
}

document.getElementById("agLoginBtn").onclick = function(){
  document.getElementById("agLoginErr").textContent = "";
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(err){
    document.getElementById("agLoginErr").textContent = "로그인 실패: " + (err && err.message || err);
  });
};
document.getElementById("agPendingLogout").onclick = function(){ fbAuth.signOut(); };
document.getElementById("agMasterBtn").onclick = function(){
  var inp = document.getElementById("agMasterInput");
  var v = (inp.value || "").trim();
  if (!v){ inp.focus(); return; }
  document.getElementById("agMasterErr").textContent = "";
  saveMasterKey(v).then(function(){
    inp.value = "";
    grantAccess(v);
  }).catch(function(err){
    document.getElementById("agMasterErr").textContent = "저장 실패: " + (err && err.message || err);
  });
};

fbAuth.onAuthStateChanged(function(user){
  if (!user){
    if (emailLinkPending){ agShow("agLoading"); return; }  /* 링크 로그인 진행 중 — 로그인 카드 깜빡임 방지 */
    AUTH.user = null; AUTH.grade = 0; AUTH.isAdmin = false;
    clearKey();   /* 로그아웃 시 localStorage의 접속 키·데이터 캐시 제거 */
    state.data = null; state.loading = true; state.error = null; state.keyError = null;
    state.cachedAt = 0; state.fromCache = false; state.refreshing = false; state.refreshFailed = false;
    updateSyncNote();
    agShow("agLogin");
    return;
  }
  AUTH.user = user;
  AUTH.isAdmin = ADMIN_EMAILS.indexOf(String(user.email || "").toLowerCase()) !== -1;
  agShow("agLoading");
  resolveAccess(user);
});

/* 내 users 문서 확인 → 없으면 '대기'로 자동 생성 (admin.html과 동일 규칙 준수) */
function resolveAccess(user){
  if (AUTH.isAdmin){ AUTH.grade = 1; openVault(); return; }
  var ref = fbDb.collection("users").doc(user.uid);
  ref.get().then(function(snap){
    if (!snap.exists){
      /* 규칙상 '대기' + grade 0 으로만 생성 가능 */
      return ref.set({
        email: String(user.email || "").toLowerCase(),
        name: user.displayName || "",
        grade: 0,
        status: "대기",
        requestedAt: new Date().toISOString()
      }).then(showPendingGate);
    }
    var d = snap.data() || {};
    if (d.status === "차단"){
      agDenied("접근이 차단되었습니다", esc(user.email) + "<br>관리자에게 문의하십시오.", false);
      return;
    }
    if (d.status === "활성" && (d.grade === 1 || d.grade === 2)){
      AUTH.grade = d.grade; openVault(); return;
    }
    if (d.status === "활성" && (d.grade === 3 || d.grade === 4)){
      agDenied("임원 이상 전용 화면입니다",
        "이 화면은 임원 이상 전용입니다. 관리 포털을 이용하세요.", true);
      return;
    }
    showPendingGate();
  }).catch(function(err){
    agShow("agLogin");
    document.getElementById("agLoginErr").textContent = "접근 확인 실패: " + (err && err.message || err);
  });
}
function showPendingGate(){
  document.getElementById("agPendingEmail").textContent = AUTH.user && AUTH.user.email || "";
  agShow("agPending");
}

/* 금고 열기: config/portal.masterKey → 기존 KEY 경로에 주입 후 대시보드 시작 */
function openVault(){
  fbDb.collection("config").doc("portal").get().then(function(snap){
    var mk = snap.exists ? String((snap.data() || {}).masterKey || "").trim() : "";
    if (mk){ grantAccess(mk); return; }
    if (AUTH.isAdmin){ agShow("agMaster"); return; }   /* 어드민만 1회 등록 가능 */
    agDenied("마스터 키 미등록",
      "금고에 마스터 키가 아직 등록되지 않았습니다.<br>관리자(대표)가 먼저 등록해야 합니다.", false);
  }).catch(function(err){
    agDenied("접속 확인 실패", esc(err && err.message || String(err)), false);
  });
}
function grantAccess(masterKey){
  setKey(masterKey);   /* 로그인 성공 경로에서만 localStorage 갱신 */
  state.loading = true; state.error = null; state.keyError = null;
  agHide();
  startDashboard();
}

/* ============ 배포 갱신 자동 감지 ============
   GitHub Pages 캐시(10분) 때문에 구버전 화면이 보일 수 있음.
   서버의 Last-Modified 를 확인해 새 배포가 감지되면 캐시를 우회해 자동 새로고침. */
(function autoUpdate(){
  if (location.protocol === "file:") return;   /* 로컬 실행본은 해당 없음 */
  function check(){
    fetch(location.pathname + "?head=" + Date.now(), { method:"HEAD", cache:"no-store" }).then(function(r){
      var lm = r.headers.get("last-modified") || "";
      if (!lm) return;
      var cur = localStorage.getItem("appleseed_app_lm");
      if (cur && cur !== lm && sessionStorage.getItem("appleseed_app_rl") !== lm){
        sessionStorage.setItem("appleseed_app_rl", lm);   /* 재로드 루프 방지 */
        localStorage.setItem("appleseed_app_lm", lm);
        location.replace(location.pathname + "?cb=" + Date.now() + location.hash);
        return;
      }
      localStorage.setItem("appleseed_app_lm", lm);
    }).catch(function(){});
  }
  check();
  setInterval(check, 5 * 60 * 1000);   /* 열어둔 탭도 5분마다 확인 */
})();

})();
</script>
