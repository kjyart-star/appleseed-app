<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>애플시드 관리 시스템</title>
<style>
  /* ===== 토큰: 다크 기본 (dashboard.html 계승) ===== */
  :root{
    color-scheme: dark;
    --bg:#111311; --surface:#1a1d19; --surface-2:#20241f; --surface-3:#262b23;
    --line:#2c302a; --line-strong:#3a3f37;
    --ink:#f0f1ea; --ink-2:#b6b9ac; --ink-3:#868a7c;
    --accent:#5cbb92; --accent-soft:#1e2f27; --accent-ink:#8fd3b3;
    --vfx:#3987e5; --vfx-soft:#16273b;
    --aivfx:#199e70; --aivfx-soft:#123128;
    --aicontent:#d95926; --aicontent-soft:#33221a;
    --aiedu:#d55181; --aiedu-soft:#331a24;
    --mk-cal:#4aa84a; --mk-act:#c98500; --mk-deadline:#9085e9;
    --pos:#5cbb92; --pending:#d6a63f; --pending-soft:#332b13;
    --urgent:#e46a5c; --urgent-soft:#351f1c;
    --rev:#5cbb92; --rev-wait:#3d6d59; --cost:#cf8461; --grid:#2a2e27;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.34);
    --radius:14px;
    --font:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    --sidebar-w:260px;
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --bg:#f6f5ef; --surface:#fffffe; --surface-2:#faf9f3; --surface-3:#f2f0e6;
    --line:#e6e4d8; --line-strong:#d3d0c2;
    --ink:#1b1e1a; --ink-2:#55584e; --ink-3:#83867a;
    --accent:#2f7d5b; --accent-soft:#e4efe8; --accent-ink:#235e45;
    --vfx:#2a78d6; --vfx-soft:#e2edfb;
    --aivfx:#1baf7a; --aivfx-soft:#dcf0e8;
    --aicontent:#eb6834; --aicontent-soft:#fbe8dd;
    --aiedu:#e87ba4; --aiedu-soft:#fbe3ec;
    --mk-cal:#008300; --mk-act:#eda100; --mk-deadline:#4a3aa7;
    --pos:#2f7d5b; --pending:#b07d16; --pending-soft:#f6ecd2;
    --urgent:#cf4a3c; --urgent-soft:#fae2df;
    --rev:#2f7d5b; --rev-wait:#7fb79e; --cost:#b0603a; --grid:#e9e7db;
    --shadow:0 1px 2px rgba(30,34,26,.04), 0 6px 20px rgba(30,34,26,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font); color:var(--ink); background:var(--bg);
    -webkit-font-smoothing:antialiased; line-height:1.55; font-size:15px;}
  .tnum{font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:var(--font);}

  /* ===== 레이아웃 ===== */
  .app{display:flex; min-height:100vh;}
  .sidebar{width:var(--sidebar-w); flex:none; background:var(--surface);
    border-right:1px solid var(--line); position:fixed; top:0; bottom:0; left:0;
    display:flex; flex-direction:column; z-index:40;}
  .sb-brand{display:flex; align-items:center; gap:11px; padding:18px 18px 14px;
    border-bottom:1px solid var(--line); flex:none;}
  .sb-brand .mark{width:32px;height:32px;flex:none;}
  .sb-brand h1{margin:0;font-size:17px;font-weight:800;letter-spacing:-.02em;}
  .sb-brand .sub{margin:1px 0 0;font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;}
  .sb-nav{flex:1; overflow-y:auto; padding:12px 10px 8px;}
  .sb-nav::-webkit-scrollbar{width:8px;}
  .sb-nav::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px;}
  .nav-cap{font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700; padding:12px 10px 5px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 12px; margin:2px 0;
    border-radius:10px; cursor:pointer; color:var(--ink-2); font-size:14px;
    font-weight:600; text-decoration:none; user-select:none;}
  .nav-item .ic{width:19px; text-align:center; flex:none; font-size:14.5px;}
  .nav-item:hover{background:var(--surface-2); color:var(--ink);}
  .nav-item.active{background:var(--accent-soft); color:var(--accent-ink);}
  .nav-item .soon{margin-left:auto; font-size:9.5px; font-weight:700; color:var(--ink-3);
    background:var(--surface-3); border:1px solid var(--line); padding:1px 6px; border-radius:999px;}
  .sb-foot{flex:none; border-top:1px solid var(--line); padding:10px 12px;
    display:flex; flex-wrap:wrap; gap:7px;}
  .sb-foot button{flex:1 1 auto; min-width:0; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink-2); border-radius:9px; padding:7px 8px;
    font-size:11.5px; font-weight:700; cursor:pointer; display:flex; align-items:center;
    justify-content:center; gap:5px; white-space:nowrap;}
  .sb-foot button:hover{color:var(--ink); border-color:var(--accent);}
  .sb-foot button.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent);}

  .main{flex:1; margin-left:var(--sidebar-w); min-width:0; display:flex; flex-direction:column;}
  .topbar{display:none;}
  .content{padding:clamp(20px,3vw,40px); max-width:none; width:100%; margin:0 auto;} /* 브라우저 폭에 맞춰 유동 */

  /* ===== 페이지 헤더 ===== */
  .page-head{display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between;
    gap:12px; margin-bottom:24px;}
  .page-head .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700;}
  .page-head h2{margin:2px 0 0; font-size:clamp(19px,2.6vw,24px); font-weight:800; letter-spacing:-.02em;}
  .page-head .desc{margin:5px 0 0; font-size:13px; color:var(--ink-3);}
  .page-head .ph-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ===== 버튼 ===== */
  .btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
    border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.sm{padding:5px 10px; font-size:12px; border-radius:8px;}
  .btn.danger:hover{border-color:var(--urgent); color:var(--urgent);}
  .btn.ghost{background:transparent;}

  /* ===== 섹션/카드 ===== */
  section.panel{background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:24px;}
  .sec-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:18px 22px 0;}
  .sec-head h3{margin:0; font-size:15.5px; font-weight:700; letter-spacing:-.01em;}
  .sec-head .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-3); font-weight:700;}
  .sec-note{font-size:12.5px; color:var(--ink-3);}
  .fold-head{cursor:pointer; user-select:none;}
  .fold-btn{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px;
    border:1px solid var(--line-strong); color:var(--ink-2); font-size:13px; transition:transform .18s; flex:none;}
  section.collapsed .fold-btn{transform:rotate(-90deg);}
  section.collapsed .fold-body{display:none;}

  /* ===== KPI ===== */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
  .kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px; display:flex; flex-direction:column; gap:10px;
    position:relative; overflow:hidden;}
  .kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);}
  .kpi.k-cost::before{background:var(--cost);} .kpi.k-profit::before{background:var(--vfx);}
  .kpi.k-ar::before{background:var(--pending);}
  .kpi .label{font-size:12.5px; color:var(--ink-2); font-weight:600;}
  .kpi .big{font-size:clamp(21px,3vw,27px); font-weight:800; letter-spacing:-.02em; line-height:1.05;}
  .kpi .big small{font-size:14px; font-weight:700; color:var(--ink-2); margin-left:1px;}
  .kpi .meta{font-size:12.5px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:4px 10px;}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .chip::before{content:""; width:6px; height:6px; border-radius:999px; background:currentColor; opacity:.9;}
  .chip.pos{color:var(--pos); background:var(--accent-soft);}
  .chip.wait{color:var(--pending); background:var(--pending-soft);}

  /* ===== AI 전환 스트립 ===== */
  .ai-strip{padding:15px 20px 20px;}
  .ais-row{display:flex; align-items:center; flex-wrap:wrap; gap:14px 22px;}
  .ais-lead{display:flex; flex-direction:column; gap:2px; flex:none;}
  .ais-title{font-size:14px; font-weight:700;}
  .ais-pct{font-size:clamp(24px,3.4vw,30px); font-weight:800; letter-spacing:-.02em; color:var(--aivfx); flex:none; line-height:1;}
  .ais-pct small{font-size:15px; font-weight:700; margin-left:1px;}
  .ais-track-wrap{flex:1 1 320px; min-width:240px;}
  .ais-track{position:relative; height:12px; border-radius:999px; background:var(--line); overflow:visible;}
  .ais-track > i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--vfx),var(--aivfx));}
  .ais-mark{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--line-strong); border-radius:2px;}
  .ais-mark.reached{background:var(--accent);}
  .ais-mark span{position:absolute; top:18px; left:50%; transform:translateX(-50%);
    font-size:10.5px; color:var(--ink-3); white-space:nowrap;}
  .ais-mark span b{color:var(--ink-2); font-weight:700;}
  .ais-scale{height:30px;}
  .ais-note{font-size:12px; color:var(--ink-2); margin-top:4px;}
  .ais-note b{color:var(--ink); font-weight:700;}
  .ais-note .sub2{display:block; color:var(--ink-3); margin-top:3px; font-size:11.5px;}

  /* ===== 시간 진행률 ===== */
  .time-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; padding:16px 20px 18px;}
  .tp-item{display:flex; flex-direction:column; gap:8px;}
  .tp-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .tp-label{font-size:12.5px; font-weight:700; color:var(--ink-2);}
  .tp-val{font-size:18px; font-weight:800; color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
  .tp-bar{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
  .tp-bar i{display:block; height:100%; border-radius:999px;}
  .tp-bar i.year{background:linear-gradient(90deg,var(--mk-deadline),var(--vfx));}
  .tp-bar i.month{background:linear-gradient(90deg,color-mix(in srgb,var(--vfx) 42%,var(--surface)),var(--vfx));}
  .tp-bar i.week{background:linear-gradient(90deg,color-mix(in srgb,var(--aivfx) 42%,var(--surface)),var(--aivfx));}
  .tp-bar i.today{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 42%,var(--surface)),var(--accent));}
  .tp-cap{font-size:11.5px; color:var(--ink-3);}
  .tp-cap b{color:var(--ink-2); font-weight:700;}

  /* ===== 달력 (월 컨테이너 = .cal-month, 마커점 = .cdot) ===== */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px 0;}
  .cal-nav-label{font-size:13px; font-weight:700; color:var(--ink);}
  .cal-nav-btn{border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
    border-radius:999px; padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;}
  .cal-nav-btn:hover{color:var(--ink); border-color:var(--accent);}
  /* 분기 달력: 3개 월이 화면 폭을 균등 분할 (넓은 화면에서 좌측 쏠림 방지) */
  .cal-wrap{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:start; gap:20px; padding:14px 20px 6px;}
  .cal-month{min-width:0;
    background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 18px 12px;}
  .cal-mtitle{font-size:14px; font-weight:700; color:var(--ink); margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid var(--line);}
  @media (max-width:1100px){ .cal-wrap{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:720px){ .cal-wrap{grid-template-columns:1fr;} }
  /* 분기 달력 전용: 넓어진 카드에 맞춰 날짜 칸·글자 확대 */
  .cal-wrap .cal-cell{height:50px; font-size:13.5px; gap:4px;}
  .cal-wrap .cal-dow{font-size:12px; padding:4px 0 6px;}
  .cal-wrap .cdot{width:6px; height:6px;}
  .cal-wrap .cal-cell.today .cnum{width:26px; height:26px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px;}
  .cal-dow{font-size:10.5px; font-weight:700; color:var(--ink-3); text-align:center; padding:2px 0 4px;}
  .cal-dow.sun{color:var(--urgent);}
  .cal-cell{height:42px; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:3px; border-radius:8px; font-size:12px; color:var(--ink); position:relative;}
  .cal-cell.empty{visibility:hidden; padding:0;} /* 주의: 범용 .empty(안내문 패딩) 규칙과 충돌 방지 */
  .cal-cell.has:hover{background:var(--surface-2);}
  .cal-cell .cnum{line-height:1;}
  .cal-cell.today .cnum{background:var(--accent); color:#fff; font-weight:700; width:22px; height:22px;
    border-radius:999px; display:flex; align-items:center; justify-content:center;}
  .cal-dots{display:flex; gap:3px; height:6px; align-items:center;}
  .cdot{display:inline-block; width:5px; height:5px; border-radius:999px; flex:none;}
  .cdot.cal{background:var(--mk-cal);}
  .cdot.act{background:var(--mk-act);}
  .cdot.deadline{background:var(--mk-deadline);}
  .cdot.start{background:transparent; border:1.5px solid var(--ink-3);}
  .cal-legend{display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 20px 4px; font-size:11.5px; color:var(--ink-2);}
  .cal-legend span{display:inline-flex; align-items:center; gap:6px;}
  .cal-legend .cdot{width:8px; height:8px;}
  .cal-divider{height:1px; background:var(--line); margin:12px 20px 0;}

  /* ===== 일정 리스트 ===== */
  .sched{display:flex; flex-direction:column; padding:8px 12px 12px;}
  .sched-item{display:flex; align-items:center; gap:14px; padding:12px 8px; border-bottom:1px solid var(--line);}
  .sched-item:last-child{border-bottom:0;}
  .sched-when{flex:none; width:64px; text-align:center;}
  .sched-when .d{font-size:15px; font-weight:800;}
  .sched-when .w{font-size:11px; color:var(--ink-3); margin-top:1px;}
  .sched-item.today .sched-when .d{color:var(--accent);}
  .sched-main{flex:1; min-width:0;}
  .sched-title{font-size:14px; font-weight:600;}
  .sched-meta{font-size:11.5px; color:var(--ink-3); margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center;}
  .pill{font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:999px; white-space:nowrap;}
  .pill.today{color:var(--accent); background:var(--accent-soft);}
  .pill.allday{color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line-strong);}

  /* ===== 차트 ===== */
  .chart-body{padding:14px 16px 18px;}
  .legend{display:flex; flex-wrap:wrap; gap:14px; padding:4px 4px 12px; font-size:12px; color:var(--ink-2);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:12px; height:12px; border-radius:3px; flex:none;}
  .swatch.hatch{background-image:repeating-linear-gradient(45deg,var(--rev-wait) 0 3px,transparent 3px 6px); border:1px solid var(--rev-wait);}
  .chart-scroll{overflow-x:auto;}
  svg.bars{display:block; width:100%; min-width:460px; height:auto;}
  .bar-rect{cursor:pointer;} .bar-rect:hover{opacity:.82;}
  .axis-txt{fill:var(--ink-3); font-size:11px;}
  .axis-txt.month{fill:var(--ink-2); font-size:12.5px; font-weight:700;}
  .grid-line{stroke:var(--grid); stroke-width:1;}
  .zero-line{stroke:var(--line-strong); stroke-width:1;}

  /* ===== 프로젝트 보드 ===== */
  .proj-summary{display:flex; flex-wrap:wrap; gap:10px 22px; padding:12px 20px 0; font-size:12.5px; color:var(--ink-2);}
  .proj-summary b{color:var(--ink); font-weight:800;}
  .board{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:18px 22px 22px;}
  .card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface-2);
    display:flex; flex-direction:column; gap:12px;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card-name{font-size:14.5px; font-weight:700; letter-spacing:-.01em;}
  .card-period{font-size:11.5px; color:var(--ink-3); margin-top:3px;}
  .tag{font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .tag.vfx{color:var(--vfx); background:var(--vfx-soft);}
  .tag.aivfx{color:var(--aivfx); background:var(--aivfx-soft);}
  .tag.aicontent{color:var(--aicontent); background:var(--aicontent-soft);}
  .tag.aiedu{color:var(--aiedu); background:var(--aiedu-soft);}
  .status{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--ink-2);}
  .status .dot{width:7px; height:7px; border-radius:999px; background:var(--ink-3);}
  .status.run .dot{background:var(--accent);} .status.prop .dot{background:var(--pending);}
  .status.done .dot{background:var(--vfx);} .status.hold .dot{background:var(--ink-3);}
  .card-mid{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .amount{font-size:17px; font-weight:800;} .amount small{font-size:11.5px; font-weight:600; color:var(--ink-3);}
  .pct{font-size:12.5px; font-weight:700; color:var(--ink-2);}
  .prog{height:8px; border-radius:999px; background:var(--line); overflow:hidden;}
  .prog i{display:block; height:100%; border-radius:999px; background:var(--accent);}
  .prog i.vfx{background:var(--vfx);} .prog i.aivfx{background:var(--aivfx);}
  .prog i.aicontent{background:var(--aicontent);} .prog i.aiedu{background:var(--aiedu);}
  .prog i.zero{background:var(--line-strong);}
  .next{font-size:12px; color:var(--ink-2); display:flex; gap:7px; align-items:baseline;}
  .next .k{color:var(--ink-3); font-size:11px; white-space:nowrap;}
  .card-actions{display:flex; gap:6px; margin-top:2px;}

  /* ===== 테이블 ===== */
  .tbl-scroll{overflow-x:auto; padding:6px 8px 8px;}
  table{width:100%; border-collapse:collapse; min-width:520px;}
  thead th{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
    font-weight:700; text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); white-space:nowrap;}
  tbody td{font-size:13.5px; padding:13px 14px; border-bottom:1px solid var(--line); color:var(--ink); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:0;}
  td.r,th.r{text-align:right;} td.c,th.c{text-align:center;}
  tfoot td{font-size:13.5px; font-weight:800; padding:14px;}
  .mini-tag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; white-space:nowrap;}
  .mini-tag.vfx{color:var(--vfx); background:var(--vfx-soft);}
  .mini-tag.aivfx{color:var(--aivfx); background:var(--aivfx-soft);}
  .mini-tag.aicontent{color:var(--aicontent); background:var(--aicontent-soft);}
  .mini-tag.aiedu{color:var(--aiedu); background:var(--aiedu-soft);}
  .st-badge{font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px;}
  .st-badge.wait{color:var(--pending); background:var(--pending-soft);}
  .st-badge.done{color:var(--pos); background:var(--accent-soft);}
  /* 세금계산서 인라인 드롭다운 (배지형 <select>) */
  .tax-sel{font-size:11px; font-weight:700; border:1px solid transparent; border-radius:999px;
    padding:2px 8px; cursor:pointer; font-family:var(--font); -webkit-appearance:none; appearance:none;
    text-align:center; text-align-last:center;}
  .tax-sel:focus{outline:none; border-color:var(--accent);}
  .tax-sel.t-wait{color:var(--pending); background:var(--pending-soft);}
  .tax-sel.t-done{color:var(--pos); background:var(--accent-soft);}
  .tax-sel.t-none{color:var(--ink-3); background:var(--surface-2);}
  .tax-sel option{color:var(--ink); background:var(--surface);}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    border-radius:7px; width:28px; height:28px; cursor:pointer; font-size:13px; display:grid; place-items:center;}
  .icon-btn:hover{border-color:var(--accent); color:var(--ink);}
  .icon-btn.del:hover{border-color:var(--urgent); color:var(--urgent);}

  /* ===== 할일 ===== */
  .todo{display:flex; align-items:center; gap:13px; padding:13px 8px; border-bottom:1px solid var(--line);}
  .todo:last-child{border-bottom:0;}
  .todo.done .a-title{text-decoration:line-through; color:var(--ink-3);}
  .chk{width:22px; height:22px; border-radius:7px; border:1.5px solid var(--line-strong);
    background:var(--surface); cursor:pointer; flex:none; display:grid; place-items:center; font-size:13px; color:transparent;}
  .todo.done .chk{background:var(--accent); border-color:var(--accent); color:#fff;}
  .dday{flex:none; width:56px; text-align:center; font-weight:800; font-size:13px; padding:6px 0; border-radius:9px;}
  .dday.soon{color:var(--urgent); background:var(--urgent-soft);}
  .dday.mid{color:var(--pending); background:var(--pending-soft);}
  .dday.far{color:var(--ink-3); background:var(--surface-2);}
  .dday.over{color:#fff; background:var(--urgent);}
  .a-main{flex:1; min-width:0;}
  .a-title{font-size:14px; font-weight:600;}
  .a-meta{font-size:11.5px; color:var(--ink-3); margin-top:3px; display:flex; flex-wrap:wrap; gap:4px 12px;}
  .owner-none{color:var(--pending);}

  /* ===== 메모/전사록 리스트 ===== */
  .list-2col{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; padding:18px 22px 22px;}
  .memo-card{border:1px solid var(--line); border-radius:12px; padding:16px 18px; background:var(--surface-2);
    display:flex; flex-direction:column; gap:8px;}
  .memo-card h4{margin:0; font-size:14.5px; font-weight:700;}
  .memo-card p{margin:0; font-size:12.5px; color:var(--ink-2); white-space:pre-wrap; line-height:1.55;
    max-height:9.5em; overflow:hidden;}
  .memo-card .meta{font-size:11px; color:var(--ink-3);}
  .meet-item{padding:14px 8px; border-bottom:1px solid var(--line); cursor:pointer;}
  .meet-item:last-child{border-bottom:0;}
  .meet-item:hover{background:var(--surface-2);}
  .meet-item .mt{display:flex; align-items:center; gap:10px;}
  .meet-item .mdate{font-size:12px; color:var(--ink-3); font-weight:700; width:92px; flex:none;}
  .meet-item .mtitle{font-size:14px; font-weight:700;}
  .meet-sum{font-size:12.5px; color:var(--ink-2); margin-top:8px; white-space:pre-wrap; line-height:1.6;
    display:none; padding-left:102px;}
  .meet-item.open .meet-sum{display:block;}

  /* ===== 플레이스홀더 ===== */
  .placeholder{margin:0; border:1.5px dashed var(--line-strong); border-radius:14px; padding:56px 24px;
    text-align:center; color:var(--ink-3); background:var(--surface-2);}
  .placeholder .ico{font-size:34px; opacity:.55;}
  .placeholder h3{margin:12px 0 0; font-size:16px; color:var(--ink-2);}
  .placeholder p{margin:8px auto 0; font-size:13px; max-width:420px; line-height:1.6;}
  .empty{padding:40px 20px; text-align:center; color:var(--ink-3); font-size:13px;}

  /* ===== 리포트 ===== */
  .rep-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .rep-wrap{display:grid; grid-template-columns:clamp(260px,26vw,360px) minmax(0,1fr); gap:20px; align-items:start;}
  .rep-list{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden;}
  .rep-item{display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line);
    background:transparent; padding:13px 15px; cursor:pointer;}
  .rep-item:last-child{border-bottom:0;}
  .rep-item:hover{background:var(--surface-2);}
  .rep-item.on{background:var(--accent-soft);}
  .rep-item .ri-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .rep-item .ri-title{font-size:13.5px; font-weight:700; color:var(--ink); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rep-item.on .ri-title{color:var(--accent-ink);}
  .rep-item .ri-date{font-size:11.5px; color:var(--ink-3);}
  .rep-detail{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; min-width:0;}
  .rep-note{padding:11px 20px; font-size:12px; color:var(--ink-3);
    background:var(--surface-2); border-bottom:1px solid var(--line);}
  .rep-d-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:16px 20px; border-bottom:1px solid var(--line);}
  .rep-d-title{font-size:18px; font-weight:800; letter-spacing:-.01em;}
  .rep-d-meta{font-size:12px; color:var(--ink-3); margin-top:6px; display:flex; gap:8px;
    align-items:center; flex-wrap:wrap;}
  .rep-content{padding:18px 20px; font-size:13.5px; line-height:1.7; color:var(--ink-2);
    white-space:pre-wrap; word-break:break-word;}
  .rep-content a{color:var(--accent-ink); text-decoration:underline; text-underline-offset:2px;}
  .rep-content a:hover{color:var(--accent);}
  /* 뉴스 링크 카드 (파비콘+도메인) */
  .rep-content .news-card{display:inline-flex; align-items:center; gap:7px; padding:5px 11px;
    border:1px solid var(--line-strong); border-radius:9px; background:var(--surface-2);
    text-decoration:none; margin:3px 0; vertical-align:middle;}
  .rep-content .news-card:hover{border-color:var(--accent);}
  .rep-content .nc-ico{width:16px; height:16px; border-radius:4px; display:block;}
  .rep-content .nc-domain{font-size:12px; color:var(--ink-2);}
  .rep-content .nc-go{font-size:12px; color:var(--accent-ink); font-weight:700; text-decoration:none;}
  /* 유튜브 썸네일 카드 */
  .rep-content .yt-thumb{display:inline-flex; flex-direction:column; gap:5px; margin:8px 12px 8px 0;
    text-decoration:none; vertical-align:top;}
  .rep-content .yt-thumb img{width:250px; max-width:100%; border-radius:10px;
    border:1px solid var(--line); display:block;}
  .rep-content .yt-thumb span{font-size:12px; color:var(--accent-ink); font-weight:700;}
  /* 리치 아이템 카드: [썸네일 | 제목·설명·링크] — 연속 카드는 card-grid로 2열 배치 */
  .rep-content .card-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px; margin:8px 0; white-space:normal;}
  .rep-content .card-grid .item-card{margin:0;}
  .rep-content .card-grid .item-card.yt img{width:150px;}
  .rep-content .item-card{display:flex; gap:14px; align-items:flex-start; width:100%;
    border:1px solid var(--line); border-radius:12px; background:var(--surface-2);
    padding:13px 15px; margin:8px 0; text-decoration:none; white-space:normal;}
  .rep-content .item-card:hover{border-color:var(--accent);}
  .rep-content .item-card img{flex:none; display:block; border-radius:8px;}
  .rep-content .item-card.yt img{width:200px; aspect-ratio:16/9; object-fit:cover; border:1px solid var(--line);}
  .rep-content .item-card.news img{width:42px; height:42px; padding:6px; background:var(--surface);
    border:1px solid var(--line);}
  .rep-content .ic-body{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .rep-content .ic-title{font-weight:700; color:var(--ink); font-size:14.5px; line-height:1.45;}
  .rep-content .ic-desc{font-size:13px; color:var(--ink-2); line-height:1.55;}
  .rep-content .ic-url{font-size:11.5px; color:var(--ink-3); word-break:break-all; text-decoration:none;}
  @media (max-width:860px){
    .rep-content .card-grid{grid-template-columns:1fr;}
  }
  @media (max-width:600px){
    .rep-content .item-card{flex-direction:column;}
    .rep-content .item-card.yt img{width:100%;}
  }
  .rtype-badge{font-size:11px; font-weight:700; padding:2px 9px; border-radius:999px; white-space:nowrap;}
  .rtype-badge.daily{color:var(--vfx); background:var(--vfx-soft);}
  .rtype-badge.weekly{color:var(--aivfx); background:var(--aivfx-soft);}
  .rtype-badge.monthly{color:var(--aiedu); background:var(--aiedu-soft);}
  .rtype-badge.adhoc{color:var(--ink-3); background:var(--surface-2);}
  .rtype-badge.brief{color:var(--aicontent); background:var(--aicontent-soft);}
  @media (max-width:820px){ .rep-wrap{grid-template-columns:1fr;} }

  /* ===== 요약 소계 스트립 ===== */
  .sum-strip{display:flex; flex-wrap:wrap; gap:8px 10px; padding:14px 20px 0;}
  .sum-chip{border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:8px 12px;
    font-size:12px; color:var(--ink-2);}
  .sum-chip b{display:block; color:var(--ink); font-weight:800; font-size:15px; margin-top:2px;}

  /* ===== 폼 모달 ===== */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100; display:flex;
    align-items:flex-start; justify-content:center; padding:5vh 16px; overflow-y:auto;}
  .modal{background:var(--surface); border:1px solid var(--line-strong); border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.4); width:100%; max-width:460px; overflow:hidden;}
  .modal-h{padding:18px 20px 14px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; justify-content:space-between;}
  .modal-h h3{margin:0; font-size:16px; font-weight:800;}
  .modal-b{padding:16px 20px; display:flex; flex-direction:column; gap:13px; max-height:64vh; overflow-y:auto;}
  .fld{display:flex; flex-direction:column; gap:5px;}
  .fld label{font-size:12px; font-weight:700; color:var(--ink-2);}
  .fld input, .fld select, .fld textarea{border:1px solid var(--line-strong); background:var(--surface-2);
    color:var(--ink); border-radius:9px; padding:9px 11px; font-size:13.5px; font-family:var(--font); width:100%;}
  .fld input:focus, .fld select:focus, .fld textarea:focus{outline:none; border-color:var(--accent);}
  .fld textarea{min-height:88px; resize:vertical;}
  .fld.chk-row{flex-direction:row; align-items:center; gap:8px;}
  .fld.chk-row input{width:auto;}
  /* 시간 자체 드롭다운 (오전/오후·시·분) */
  .time-sel{display:flex; align-items:center; gap:6px;}
  .time-sel select{flex:1; min-width:0;}
  .ts-colon{color:var(--ink-3); font-weight:700;}
  .modal-f{padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}

  /* ===== 툴팁 ===== */
  .tooltip{position:fixed; z-index:200; pointer-events:none; opacity:0; transition:opacity .1s;
    background:var(--ink); color:var(--bg); padding:8px 11px; border-radius:9px; font-size:12px;
    line-height:1.5; box-shadow:0 8px 24px rgba(0,0,0,.28); max-width:240px;}
  .tooltip b{font-weight:700;}
  .tooltip .tt-row{display:flex; justify-content:space-between; gap:16px;}
  .tooltip .tt-row span:first-child{opacity:.8;}

  .masked-note{font-size:11px; color:var(--pending); margin-left:6px;}

  /* ===== 시계·날짜·날씨 위젯 ===== */
  .wg-strip{padding:16px 20px;}
  .wg-row{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px 22px;}
  .wg-clock-wrap{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .wg-eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3); font-weight:700;}
  .wg-clock{font-size:clamp(22px,4.4vw,30px); font-weight:800; letter-spacing:-.01em; line-height:1.05; color:var(--ink);
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
  .wg-date{font-size:13.5px; color:var(--ink-2); font-weight:600;}
  .wg-weather{display:flex; align-items:center; gap:13px; flex:none;}
  .wg-weather .wg-ico{font-size:clamp(30px,5vw,40px); line-height:1;}
  .wg-weather .wg-wx{display:flex; flex-direction:column; gap:3px;}
  .wg-temp{font-size:clamp(20px,3.4vw,26px); font-weight:800; letter-spacing:-.02em; line-height:1; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .wg-temp small{font-size:14px; font-weight:700; color:var(--ink-2); margin-left:1px;}
  .wg-desc{font-size:12.5px; color:var(--ink-3);}
  .wg-desc b{color:var(--ink-2); font-weight:700;}

  /* ===== 프로젝트관리 (목록 + 3단 상세) ===== */
  .crm-wide{max-width:none;}
  .dash-ws{margin-bottom:20px;}
  .proj-empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:48px 20px; color:var(--ink-3);}
  .proj-empty .pe-ico{font-size:34px;}
  .proj-empty h3{font-size:15px; color:var(--ink); margin:0;}
  .proj-empty p{font-size:12.5px; margin:0 0 6px;}
  /* 목록 뷰 */
  .proj-toolbar{padding:14px 16px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:12px;}
  .proj-toolbar .proj-search{max-width:360px;}
  .proj-frow{display:flex; align-items:flex-start; gap:10px;}
  .proj-frow-k{font-size:11.5px; font-weight:800; color:var(--ink-3); width:52px; flex:none; padding-top:7px;}
  .proj-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .proj-chip{border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-2);
    border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:700; cursor:pointer;
    display:inline-flex; align-items:center;}
  .proj-chip:hover{color:var(--ink); border-color:var(--accent);}
  .proj-chip.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .proj-chip .chip-n{margin-left:6px; font-size:11px; opacity:.8; font-weight:800;}
  .proj-table{min-width:860px;}
  .proj-table th.sortable{cursor:pointer; user-select:none; white-space:nowrap;}
  .proj-table th.sortable:hover{color:var(--ink);}
  .proj-table .sort-ar{opacity:.55; font-size:10px; margin-left:3px;}
  .proj-table td{vertical-align:middle;}
  .proj-row{cursor:pointer;}
  .proj-row:hover{background:var(--surface-2);}
  .pl-prog{display:flex; align-items:center; gap:7px; min-width:112px;}
  .pl-prog .prog{flex:1;}
  .proj-status-sel{font-size:11.5px; font-weight:700; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink); border-radius:999px; padding:3px 8px; cursor:pointer; font-family:var(--font);}
  .proj-status-sel:focus{outline:none; border-color:var(--accent);}
  /* 상세 뷰 3단 */
  .proj-crm{display:grid; grid-template-columns:clamp(280px,20vw,400px) minmax(0,1fr) clamp(300px,23vw,440px); gap:20px; align-items:start;}
  .proj-crm .proj-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;}
  .proj-detail .proj-card:last-child, .proj-rail .proj-card:last-child{margin-bottom:0;}
  .proj-card-h{display:flex; align-items:center; gap:8px; padding:14px 16px; font-size:14px; font-weight:800;
    border-bottom:1px solid var(--line);}
  .proj-card-h .pc-sub{font-size:11.5px; font-weight:600; color:var(--ink-3);}
  .proj-mini-add{margin-left:auto;}
  .proj-sub-empty{padding:16px; text-align:center; color:var(--ink-3); font-size:12.5px;}
  .proj-crm .proj-card .tbl-scroll{padding:6px 10px 10px;}
  .proj-crm .proj-card table{min-width:0;}
  .proj-crm .proj-card .todo{padding:11px 16px;}
  .proj-list{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; position:sticky; top:16px;}
  .proj-list-head{padding:15px 15px 13px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px;}
  .proj-add-btn{width:100%; justify-content:center;}
  .proj-search{border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink);
    border-radius:9px; padding:10px 12px; font-size:13.5px; width:100%; font-family:var(--font);}
  .proj-search:focus{outline:none; border-color:var(--accent);}
  .proj-count{font-size:11.5px; color:var(--ink-3); font-weight:700;}
  .proj-cards{max-height:calc(100vh - 232px); overflow-y:auto; padding:8px;}
  .proj-cards::-webkit-scrollbar{width:8px;}
  .proj-cards::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:8px;}
  .proj-item{display:block; width:100%; text-align:left; border:1px solid transparent; background:transparent;
    border-radius:10px; padding:11px 13px; cursor:pointer; margin-bottom:3px;}
  .proj-item:hover{background:var(--surface-2);}
  .proj-item.on{background:var(--accent-soft); border-color:var(--accent);}
  .pi-top{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .pi-name{font-size:14px; font-weight:700; color:var(--ink); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .proj-item.on .pi-name{color:var(--accent-ink);}
  .pi-top .status{flex:none;}
  .pi-sub{font-size:11.5px; color:var(--ink-3); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .proj-detail{min-width:0;}
  .proj-back-row{margin-bottom:10px;}
  .proj-d-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:15px 18px; margin-bottom:14px;}
  .proj-d-name{font-size:19px; font-weight:800; letter-spacing:-.02em; margin-bottom:6px;}
  .proj-d-actions{display:flex; gap:7px; flex:none;}
  .proj-fields{display:grid; grid-template-columns:1fr 1fr; padding:4px 16px 12px;}
  .proj-field{display:flex; flex-direction:column; gap:4px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .proj-field.wide{grid-column:1/-1;}
  .proj-fields .proj-field:last-child{border-bottom:0;}
  .pf-k{font-size:11px; color:var(--ink-3); font-weight:700;}
  .pf-v{font-size:13.5px; color:var(--ink); font-weight:600;}
  .pf-prog{display:flex; align-items:center; gap:10px;}
  .pf-prog .prog{flex:1;}
  .proj-memo{padding:11px 16px; border-bottom:1px solid var(--line);}
  .proj-memo:last-child{border-bottom:0;}
  .pm-top{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  .pm-title{font-size:13px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pm-actions{display:flex; gap:5px; flex:none;}
  .pm-body{font-size:12.5px; color:var(--ink-2); white-space:pre-wrap; line-height:1.55; margin-top:5px;}
  .pm-date{font-size:11px; color:var(--ink-3); margin-top:6px;}
  .proj-rail{position:sticky; top:16px;}
  .proj-cal{padding:12px 12px 10px;}
  .proj-cal-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px;}
  .proj-cal-title{font-size:12.5px; font-weight:800; color:var(--ink);}
  .proj-cal .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .proj-cal .cal-cell{height:32px; font-size:11px;}
  .proj-need{padding:6px;}
  .proj-need-row{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:1px solid transparent;
    background:transparent; border-radius:9px; padding:9px 10px; cursor:pointer;}
  .proj-need-row:hover{background:var(--surface-2);}
  .proj-need-row.zero{opacity:.5; cursor:default;}

<script>
(function(){
"use strict";

/* ============ 접근 키 ============ */
var qs = new URLSearchParams(location.search);
var KEY = qs.get("key") || localStorage.getItem("appleseed_key") || "";
if (qs.get("key")) localStorage.setItem("appleseed_key", qs.get("key"));

/* ============ 상태 ============ */
var state = { data:null, mask: localStorage.getItem("appleseed_mask")==="1", loading:true, error:null };

/* ============ 유틸 ============ */
function esc(s){ s = (s==null?"":String(s));
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* 본문 속 URL을 새 탭으로 열리는 링크로 변환 (이스케이프 후 치환 — 괄호·따옴표는 URL에서 제외).
   유튜브 링크는 썸네일 카드로 렌더링 */
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s)<>"'　]+)/g, function(u){
    var m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
    if (m) {
      return "<a class='yt-thumb' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='https://i.ytimg.com/vi/"+m[1]+"/mqdefault.jpg' alt='유튜브 썸네일' loading='lazy'>"+
        "<span>▶ 영상 보기</span></a>";
    }
    var h = u.match(/^https?:\/\/([^\/]+)/);
    var host = h ? h[1].replace(/^www\./,"") : "";
    return "<a class='news-card' href='"+u+"' target='_blank' rel='noopener noreferrer'>"+
      "<img class='nc-ico' src='https://www.google.com/s2/favicons?domain="+host+"&amp;sz=64' alt='' loading='lazy'>"+
      "<span class='nc-domain'>"+host+"</span><span class='nc-go'>기사 보기 ↗</span></a>";
  });
}
/* 리포트 본문을 리치 카드로 렌더링: "• 제목 — 요약 (출처: URL)" 줄을
   [썸네일 | 제목·설명·링크] 가로 카드로 변환 (유튜브=영상 썸네일, 뉴스=언론사 아이콘) */
function richReport(s){
  /* Gemini가 마크다운(**볼드, * 불릿)으로 쓰는 경우 정규화 */
  var lines = String(s==null?"":s).replace(/\*\*/g,"").split("\n");
  var out = [], cardBuf = [];
  /* 연속된 카드 라인은 2열 그리드(card-grid)로 묶는다 */
  function flushCards(){
    if (cardBuf.length){
      out.push("<span class='card-grid'>"+cardBuf.join("")+"</span>");
      cardBuf = [];
    }
  }
  for (var i=0;i<lines.length;i++){
    var t = lines[i].trim();
    var um = t.match(/(https?:\/\/[^\s)<>"'　]+)/);
    if (/^[•\-*]/.test(t) && um){
      var url = um[1];
      var body = t.replace(/^[•\-*]+\s*/,"")
        .replace(/[\(（]\s*(?:출처|링크)\s*:?\s*https?:\/\/[^\s)）]+\s*[\)）]?/g,"")
        .replace(/https?:\/\/[^\s)<>"'　]+/g,"")
        .replace(/[\(（]\s*[\)）]/g,"").trim();
      var title = body, desc = "";
      var dash = body.indexOf(" — "); if (dash < 0) dash = body.indexOf(" - ");
      if (dash > -1){ title = body.slice(0,dash).trim(); desc = body.slice(dash+3).trim(); }
      var ym = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{6,20})/);
      var hh = url.match(/^https?:\/\/([^\/]+)/); var hst = hh ? hh[1].replace(/^www\./,"") : "";
      var img, cls, go;
      if (ym){ img = "https://i.ytimg.com/vi/"+ym[1]+"/mqdefault.jpg"; cls = "yt"; go = "youtube.com · ▶ 영상 보기"; }
      else { img = "https://www.google.com/s2/favicons?domain="+hst+"&sz=128"; cls = "news"; go = hst+" · 기사 보기 ↗"; }
      cardBuf.push("<a class='item-card "+cls+"' href='"+esc(url)+"' target='_blank' rel='noopener noreferrer'>"+
        "<img src='"+img+"' alt='' loading='lazy'>"+
        "<span class='ic-body'><span class='ic-title'>"+esc(title)+"</span>"+
        (desc ? "<span class='ic-desc'>"+esc(desc)+"</span>" : "")+
        "<span class='ic-url'>"+esc(go)+"</span></span></a>");
    } else {
      if (t === "" && cardBuf.length){ continue; } /* 카드 사이 빈 줄로 그리드가 끊기지 않게 */
      flushCards();
      out.push(linkify(lines[i]));
    }
  }
  flushCards();
  return out.join("\n");
}
function comma(n){ n = Number(n)||0; return Math.round(n).toLocaleString("ko-KR"); }
function moneyWon(n){ return "<span class='money'>"+comma(n)+"원</span>"; }
function moneyMan(n){ var m = Math.round((Number(n)||0)/10000); return "<span class='money'>"+comma(m)+"</span><small>만원</small>"; }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function typeCls(t){ return t==="AI VFX"?"aivfx": t==="AI콘텐츠"?"aicontent": t==="AI교육"?"aiedu":"vfx"; }
function statusCls(s){ return s==="진행중"?"run": s==="제안중"?"prop": s==="완료"?"done":"hold"; }
/* 세금계산서 상태: 빈 값/누락은 "미발행"으로 취급 */
function taxStatus(r){ var t = r && r.tax_status; return (t==null || String(t).trim()==="") ? "미발행" : String(t); }
function taxCls(t){ return t==="발행완료"?"t-done": t==="불필요"?"t-none":"t-wait"; }
/* 계산서 미발행 집계(입금 상태 무관, 전체 매출 대상) */
function taxUnissued(){
  var rows = (state.data && state.data.revenue || []).filter(function(r){ return taxStatus(r)==="미발행"; });
  var sum = rows.reduce(function(a,r){ return a+(Number(r.amount)||0); },0);
  return { n:rows.length, sum:sum, rows:rows };
}
function rtypeCls(t){ return t==="일간"?"daily": t==="주간"?"weekly": t==="월간"?"monthly": t==="브리핑"?"brief":"adhoc"; }

/* Asia/Seoul 현재 시각 */
function seoulNow(){
  var s = new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"});
  return new Date(s);
}
function pad2(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function parseDate(s){ if(!s) return null; var p=String(s).slice(0,10).split("-"); if(p.length<3) return null;
  return new Date(+p[0], +p[1]-1, +p[2]); }
var DOW = ["일","월","화","수","목","금","토"];

/* ============ API ============ */
var GAS_URL = "https://script.google.com/macros/s/AKfycbxnvU9mKh-0QseuyPhOeXJWMfT3u88LWKaMEJLEY2E77RKq4vzpqUmsuq3OLJyWjTCT/exec";
async function loadData(){
  if (window.__MOCK__){ state.data = window.__MOCK__; state.loading=false; return; }
  /* &t= 캐시버스터: 쓰기 직후 재조회가 브라우저/중간 캐시에 걸리지 않게 */
  var r = await fetch(GAS_URL + "?action=data&key=" + encodeURIComponent(KEY) + "&t=" + Date.now(), { cache: "no-store" });
  if (!r.ok){ throw new Error("HTTP "+r.status); }
  var j = await r.json();
  if (j && j.error) throw new Error(j.error);
  state.data = j;
  state.loading = false;
}
async function apiSend(method, table, id, body){
  if (window.__MOCK__){ alert("목 모드: 저장은 실서버에서만 동작합니다."); return null; }
  var action = method==="POST"?"insert":method==="PATCH"?"update":"delete";
  var r = await fetch(GAS_URL, { method:"POST", body: JSON.stringify({ key:KEY, action:action, table:table, id:id||null, row:body||null }) });
  var j = await r.json().catch(function(){return{};});
  if (!r.ok) throw new Error(j.error || ("HTTP "+r.status));
  if (j && j.error) throw new Error(j.error);
  return j;
}
var pendingIds = {};   /* 임시 id → 실제 id 확정을 기다리는 Promise (추가 직후 수정·삭제 경합 방지) */
async function crud(method, table, id, body){
  /* 방금 추가한 행(임시 id)을 곧바로 수정·삭제하는 경우: 서버 확정 id를 기다렸다가 그 id로 실행 */
  if (id != null && String(id).indexOf("tmp-") === 0 && pendingIds[id]){
    var realId = await pendingIds[id];
    if (realId == null) return;   /* 원본 저장이 실패한 행 → 처리할 대상 없음 */
    id = realId;
  }
  /* 진짜 낙관적 반영: 서버 응답을 기다리지 않고 화면부터 즉시 갱신 (실패 시 원복) */
  var list = state.data && state.data[table];
  var backup = list ? list.slice() : null;
  var tempId = null, resolvePending = null;
  if (list){
    if (method === "POST"){
      tempId = "tmp-" + Date.now();
      pendingIds[tempId] = new Promise(function(r){ resolvePending = r; });
      var tmp = {}; if (body) for (var k0 in body) tmp[k0] = body[k0];
      tmp.id = tempId;
      list.push(tmp);
    } else if (method === "PATCH"){
      for (var i0=0;i0<list.length;i0++){
        if (String(list[i0].id) === String(id)){ if (body) for (var k1 in body) list[i0][k1] = body[k1]; break; }
      }
    } else if (method === "DELETE"){
      state.data[table] = list.filter(function(r){ return String(r.id) !== String(id); });
    }
    render();
  }
  try{
    var res = await apiSend(method, table, id, body);
    /* 서버 확정값으로 교체 (임시 id → 실제 id) */
    try{
      var cur = state.data && state.data[table];
      if (cur && res && res.row){
        if (method === "POST"){
          for (var i=0;i<cur.length;i++){ if (String(cur[i].id) === String(tempId)){ cur[i] = res.row; break; } }
        } else if (method === "PATCH"){
          for (var j=0;j<cur.length;j++){ if (String(cur[j].id) === String(id)){ cur[j] = res.row; break; } }
        }
        render();
      }
    }catch(eOpt){}
    if (resolvePending) resolvePending(res && res.row ? res.row.id : null);
    /* 백그라운드 정합 재확인 (구글시트 지연 반영 대비) */
    setTimeout(function(){ loadData().then(render).catch(function(){}); }, 1500);
  }catch(e){
    if (resolvePending) resolvePending(null);
    var msg = String((e && e.message) || e);
    if (method === "DELETE" && /not found/i.test(msg)){
      /* 서버에 이미 없는 행 → 삭제 완료로 간주하고 조용히 동기화 */
      loadData().then(render).catch(function(){});
      return;
    }
    if (backup){ state.data[table] = backup; render(); }
    alert("저장 실패: " + msg);
    loadData().then(render).catch(function(){});   /* 서버 기준으로 재동기화 */
  }
}

/* 자체 확인 팝업 — 브라우저 confirm()이 차단되는 환경에서도 항상 동작 */
function confirmDlg(msg, okLabel, title){
  return new Promise(function(resolve){
    var bg = el("<div class='modal-bg'><div class='modal' style='max-width:380px'>"+
      "<div class='modal-h'><h3>"+esc(title||"확인")+"</h3><button class='icon-btn' data-cf-x>✕</button></div>"+
      "<div class='modal-b'><p style='margin:4px 0 2px; line-height:1.65'>"+esc(msg)+"</p></div>"+
      "<div class='modal-f'><button class='btn ghost' data-cf-no>취소</button>"+
      "<button class='btn primary danger' data-cf-yes>"+esc(okLabel||"확인")+"</button></div></div></div>");
    document.body.appendChild(bg);
    function done(v){ bg.remove(); resolve(v); }
    bg.querySelector("[data-cf-x]").onclick = function(){ done(false); };
    bg.querySelector("[data-cf-no]").onclick = function(){ done(false); };
    bg.querySelector("[data-cf-yes]").onclick = function(){ done(true); };
    bg.addEventListener("mousedown", function(e){ if (e.target === bg) done(false); });
  });
}

/* ============ 마스킹 ============ */
function applyMask(){

function openForm(table, row, defaults){
  var fields = FIELDS[table]; var editing = !!row;
  var body = "";
  fields.forEach(function(f){
    var name=f[0], label=f[1], type=f[2], opts=f[3];
    var val = (row && row[name]!=null) ? row[name] : (defaults && defaults[name]!=null ? defaults[name] : "");
    if (type==="checkbox"){
      body += "<div class='fld chk-row'><input type='checkbox' id='f_"+name+"' "+(val?"checked":"")+"><label for='f_"+name+"' style='font-weight:600'>"+esc(label)+"</label></div>";
    } else if (type==="select"){
      var o = opts.map(function(x){ return "<option "+(String(val)===x?"selected":"")+">"+esc(x)+"</option>"; }).join("");
      body += "<div class='fld'><label>"+esc(label)+"</label><select id='f_"+name+"'>"+o+"</select></div>";
    } else if (type==="textarea"){
      body += "<div class='fld'><label>"+esc(label)+"</label><textarea id='f_"+name+"'>"+esc(val)+"</textarea></div>";
    } else if (type==="time"){
      /* 브라우저 기본 시간선택기가 10분 단위(step)를 무시 → 자체 드롭다운 (오전/오후 · 1~12시 · 10분 단위) */
      var tv = String(val||"").slice(0,5), tap="오전", th="", tmin="";
      if (/^\d{1,2}:\d{2}$/.test(tv)){
        var hh24 = parseInt(tv.split(":")[0],10);
        tap = hh24 >= 12 ? "오후" : "오전";
        th = String(hh24 % 12 === 0 ? 12 : hh24 % 12);
        tmin = tv.split(":")[1];
      }
      var apO = ["오전","오후"].map(function(x){ return "<option"+(x===tap?" selected":"")+">"+x+"</option>"; }).join("");
      var hO = "<option value=''>--</option>";
      for (var hi=1; hi<=12; hi++) hO += "<option"+(String(hi)===th?" selected":"")+">"+hi+"</option>";
      var tmins = ["00","10","20","30","40","50"];
      if (tmin && tmins.indexOf(tmin) < 0) tmins.push(tmin); /* 기존 비정형 분(예: 04) 보존 */
      var mO = tmins.map(function(x){ return "<option"+(x===tmin?" selected":"")+">"+x+"</option>"; }).join("");
      body += "<div class='fld'><label>"+esc(label)+"</label><div class='time-sel' id='f_"+name+"'>"+
        "<select data-ap>"+apO+"</select><select data-h>"+hO+"</select><span class='ts-colon'>:</span><select data-m>"+mO+"</select></div></div>";
    } else {
      var iv = esc(val);
      body += "<div class='fld'><label>"+esc(label)+"</label><input type='"+type+"' id='f_"+name+"' value='"+iv+"'></div>";
    }
  });
  var bg = el("<div class='modal-bg'><div class='modal'><div class='modal-h'><h3>"+(editing?"수정":"추가")+" · "+esc(TITLES[routeForTable(table)]||table)+"</h3><button class='icon-btn' id='mClose'>✕</button></div><div class='modal-b'>"+body+"</div><div class='modal-f'><button class='btn ghost' id='mCancel'>취소</button><button class='btn primary' id='mSave'>저장</button></div></div></div>");
  document.body.appendChild(bg);
  function close(){ bg.remove(); }
  bg.querySelector("#mClose").onclick = close;
  bg.querySelector("#mCancel").onclick = close;
  /* 바깥에서 누르고 뗀 경우에만 닫기 — 입력칸에서 드래그하다 바깥에서 놓을 때 닫히는 오작동 방지 */
  var downOnBg = false;
  bg.addEventListener("mousedown", function(e){ downOnBg = (e.target === bg); });
  bg.addEventListener("mouseup", function(e){ if (downOnBg && e.target === bg) close(); downOnBg = false; });
  bg.querySelector("#mSave").onclick = async function(){
    var obj = {};
    fields.forEach(function(f){
      var name=f[0], type=f[2]; var inp = bg.querySelector("#f_"+name);
      if (type==="checkbox") obj[name] = inp.checked;
      else if (type==="time"){
        /* 자체 드롭다운 → "HH:mm" 24시간제로 변환 (시 미선택이면 빈 값) */
        var hv = inp.querySelector("[data-h]").value;
        if (!hv) obj[name] = "";
        else {
          var ap = inp.querySelector("[data-ap]").value;
          var mv = inp.querySelector("[data-m]").value || "00";
          var h24 = parseInt(hv,10) % 12; if (ap === "오후") h24 += 12;
          obj[name] = (h24 < 10 ? "0" : "") + h24 + ":" + mv;
        }
      }
      else if (NUMS[name]) obj[name] = inp.value===""? null : Number(inp.value);
      else obj[name] = inp.value;
    });
    close();
    if (editing) await crud("PATCH", table, row.id, obj);
    else await crud("POST", table, null, obj);
  };
}

  var label = container.querySelector("[data-clabel]");

  function monthHtml(y,m){
    var h = "<div class='cal-month'><div class='cal-mtitle'>"+y+"년 "+m+"월</div><div class='cal-grid'>";
    DOW.forEach(function(dw,i){ h += "<div class='cal-dow"+(i===0?" sun":"")+"'>"+dw+"</div>"; });
    var startDow = new Date(y,m-1,1).getDay();
    var dim = new Date(y,m,0).getDate();
    for (var i=0;i<startDow;i++) h += "<div class='cal-cell empty'></div>";
    for (var dd=1; dd<=dim; dd++){
      var kk = y+"-"+pad2(m)+"-"+pad2(dd);
      var items = map[kk]||[];
      var cls = "cal-cell"+(items.length?" has":"")+((y===today.y&&m===today.m&&dd===today.d)?" today":"");
      var dots = "";
      DOT_ORDER.forEach(function(tp){ if(items.some(function(it){return it.type===tp;})) dots += "<span class='cdot "+tp+"'></span>"; });
      var tip = "";
      if (items.length){
        var rows = items.map(function(it){ return "<div class='tt-row'><span>"+TYPE_LABEL[it.type]+"</span><span>"+esc(it.title)+"</span></div>"; }).join("");
        tip = " data-tip=\"<b>"+kk+"</b>"+rows.replace(/"/g,"&quot;")+"\"";
      }
      h += "<div class='"+cls+"'"+tip+"><div class='cnum'>"+dd+"</div><div class='cal-dots'>"+dots+"</div></div>";
    }
    h += "</div></div>";
    return h;
  }
  function draw(){
    var m1 = st.q*3-2, m3 = st.q*3;
    label.textContent = st.y+"년 "+st.q+"분기 ("+m1+"–"+m3+"월)";
    var h=""; for (var m=m1;m<=m3;m++) h += monthHtml(st.y,m);

  }
  container.querySelectorAll("[data-cnav]").forEach(function(b){
    b.onclick = function(){
      var dir = +b.getAttribute("data-cnav");
      st.q += dir;
      if (st.q<1){ st.q=4; st.y--; } if (st.q>4){ st.q=1; st.y++; }
      draw();
    };
  });
  draw();
}

/* ============ 월별 매출·매입 집계 ============ */
function monthlyAgg(){
  var d = state.data, map = {};
  function ensure(k){ if(!map[k]) map[k]={key:k, done:0, wait:0, cost:0}; return map[k]; }
  (d.revenue||[]).forEach(function(r){
    var dt = parseDate(r.date); if(!dt) return;
    var k = dt.getFullYear()+"-"+pad2(dt.getMonth()+1);
    var e = ensure(k); var amt = Number(r.amount)||0;
    if (r.status==="입금완료") e.done += amt; else e.wait += amt;
  });
  (d.expense||[]).forEach(function(x){
    var dt = parseDate(x.date); if(!dt) return;
    var k = dt.getFullYear()+"-"+pad2(dt.getMonth()+1);
    ensure(k).cost += Number(x.amount)||0;
  });
  var keys = Object.keys(map).sort();
  return keys.map(function(k){ return map[k]; });
}

/* ============ SVG 막대차트 (만원 단위) ============ */
function barChartSVG(rows){
  if (!rows.length) return "<div class='empty'>표시할 매출·매입 데이터가 없습니다.</div>";
  var W=720, H=300, padL=54, padR=16, padT=16, padB=42;
  var plotW=W-padL-padR, plotH=H-padT-padB, yb=padT+plotH;
  var maxV = 0;
  rows.forEach(function(r){ maxV = Math.max(maxV, (r.done+r.wait)/10000, r.cost/10000); });
  maxV = Math.max(maxV, 10);
  var step = Math.pow(10, Math.floor(Math.log(maxV)/Math.LN10));
  var maxY = Math.ceil(maxV/step)*step; if (maxY<maxV*1.05) maxY += step;
  function yOf(v){ return yb - (v/maxY)*plotH; }
  var s = "<svg class='bars' viewBox='0 0 "+W+" "+H+"' role='img'>";
  s += "<defs><pattern id='waitHatch' width='6' height='6' patternUnits='userSpaceOnUse' patternTransform='rotate(45)'>"+
       "<rect width='6' height='6' fill='var(--rev-wait)' fill-opacity='0.28'></rect><rect width='3' height='6' fill='var(--rev-wait)'></rect></pattern></defs>";
  var ticks=4;
  for (var g=0; g<=ticks; g++){
    var v = maxY*g/ticks, y = yOf(v);
    s += "<line x1='"+padL+"' y1='"+y+"' x2='"+(W-padR)+"' y2='"+y+"' class='"+(g===0?"zero-line":"grid-line")+"'></line>";
    s += "<text x='"+(padL-8)+"' y='"+(y+4)+"' text-anchor='end' class='axis-txt'>"+comma(v)+"</text>";
  }
  var groupW = plotW/rows.length, barW = Math.min(42, groupW*0.28), gap = Math.min(16, groupW*0.1);
  var pairW = barW*2+gap;
  rows.forEach(function(r,i){
    var gx = padL + groupW*i + (groupW-pairW)/2;
    var revX = gx, costX = gx+barW+gap;
    var done=r.done/10000, wait=r.wait/10000, cost=r.cost/10000, total=done+wait;
    var lbl = r.key.slice(5)+"월";
    if (done>0){
      var hD=(done/maxY)*plotH, yD=yb-hD;
      var rd = wait>0?0:4;
      s += "<rect class='bar-rect' x='"+revX+"' y='"+yD+"' width='"+barW+"' height='"+hD+"' rx='"+rd+"' fill='var(--rev)' data-tip=\"<b>"+lbl+" 매출·확정</b><div class=&#39;tt-row&#39;><span>확정</span><span>"+comma(done)+"만원</span></div>\"></rect>";
    }
    if (wait>0){
      var hW=(wait/maxY)*plotH, yW=yb-(total/maxY)*plotH;
      s += "<rect class='bar-rect' x='"+revX+"' y='"+yW+"' width='"+barW+"' height='"+Math.max(hW-2,1)+"' rx='4' fill='url(#waitHatch)' stroke='var(--rev-wait)' stroke-width='1' data-tip=\"<b>"+lbl+" 매출·대기</b><div class=&#39;tt-row&#39;><span>미수</span><span>"+comma(wait)+"만원</span></div><div class=&#39;tt-row&#39;><span>합계</span><span>"+comma(total)+"만원</span></div>\"></rect>";
    }
    if (total>0){
      s += "<text x='"+(revX+barW/2)+"' y='"+(yOf(total)-6)+"' text-anchor='middle' class='axis-txt' fill='var(--ink-2)' font-weight='700'>"+comma(total)+"</text>";
    }
    if (cost>0){
      var hC=(cost/maxY)*plotH, yC=yb-hC;
      s += "<rect class='bar-rect' x='"+costX+"' y='"+yC+"' width='"+barW+"' height='"+hC+"' rx='4' fill='var(--cost)' data-tip=\"<b>"+lbl+" 매입</b><div class=&#39;tt-row&#39;><span>지출</span><span>"+comma(cost)+"만원</span></div>\"></rect>";
      s += "<text x='"+(costX+barW/2)+"' y='"+(yC-6)+"' text-anchor='middle' class='axis-txt' fill='var(--ink-3)'>"+comma(cost)+"</text>";
    }
    s += "<text x='"+(gx+pairW/2)+"' y='"+(yb+22)+"' text-anchor='middle' class='axis-txt month'>"+lbl+"</text>";
  });
  s += "</svg>";
  return s;
}

var clockTimer = null;
function fmtClock(now){ return pad2(now.getHours())+":"+pad2(now.getMinutes())+":"+pad2(now.getSeconds()); }
function fmtDateKo(now){ return now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 "+DOW[now.getDay()]+"요일"; }
function tickClock(){
  var elc = document.querySelector("[data-wgclock]");
  if (!elc) return;                    // 위젯 없으면 스킵(대시보드 아님)
  var now = seoulNow();
  elc.textContent = fmtClock(now);
  var eld = document.querySelector("[data-wgdate]");
  if (eld) eld.textContent = fmtDateKo(now);
}
function startClock(){
  if (clockTimer){ clearInterval(clockTimer); clockTimer = null; }  // 중복 생성 방지
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}

/* 날씨: Open-Meteo(키 불필요, CORS 허용). weathercode→한국어+이모지 매핑.
   30분 캐시(모듈 변수+timestamp). 실패 시 날씨 영역만 조용히 숨김. */
var WCODE = {
  0:["맑음","☀️"], 1:["대체로 맑음","🌤️"], 2:["대체로 맑음","🌤️"], 3:["흐림","☁️"],
  45:["안개","🌫️"], 48:["안개","🌫️"],
  51:["이슬비","🌦️"], 53:["이슬비","🌦️"], 55:["이슬비","🌦️"], 56:["이슬비","🌦️"], 57:["이슬비","🌦️"],
  61:["비","🌧️"], 63:["비","🌧️"], 65:["비","🌧️"], 66:["비","🌧️"], 67:["비","🌧️"],
  71:["눈","🌨️"], 73:["눈","🌨️"], 75:["눈","🌨️"], 77:["눈","🌨️"],
  80:["소나기","🌧️"], 81:["소나기","🌧️"], 82:["소나기","🌧️"],
  85:["소낙눈","🌨️"], 86:["소낙눈","🌨️"],
  95:["뇌우","⛈️"], 96:["뇌우","⛈️"], 99:["뇌우","⛈️"]
};
function wxOf(code){ return WCODE[code] || ["","🌡️"]; }
var WEATHER_URL = "https://api.open-meteo.com/v1/forecast?latitude=37.5665&longitude=126.978&current_weather=true";
var WEATHER_TTL = 30*60*1000;
var weatherCache = { data:null, ts:0 };
function paintWeather(cw){
  var box = document.querySelector("[data-wgweather]");
  if (!box || !cw) return;
  var wx = wxOf(cw.weathercode);
  var ico = document.querySelector("[data-wgico]");
  var temp = document.querySelector("[data-wgtemp]");
  var desc = document.querySelector("[data-wgdesc]");
  if (ico) ico.textContent = wx[1];
  if (temp) temp.innerHTML = esc((Number(cw.temperature)||0).toFixed(1))+"<small>°C</small>";
  if (desc) desc.innerHTML = "<b>서울</b> · "+esc(wx[0]);
  box.style.display = "";
}
async function mountWeather(){
  if (weatherCache.data && (Date.now()-weatherCache.ts) < WEATHER_TTL){
    paintWeather(weatherCache.data); return;   // 30분 캐시 재사용(재요청 안 함)
  }
  try{
    var r = await fetch(WEATHER_URL);
    if (!r.ok) return;                          // 조용히 숨김
    var j = await r.json();
    var cw = j && j.current_weather;
    if (!cw) return;
    weatherCache = { data:cw, ts:Date.now() };
    paintWeather(cw);
  }catch(e){ /* 실패 시 날씨 영역만 조용히 숨김(콘솔 에러 없음) */ }
}

function schedListHtml(limit){
  var d = state.data, now = seoulNow(), todayStr = ymd(now);
  var evs = (d.calendar||[]).filter(function(c){ return c.event_date && String(c.event_date).slice(0,10) >= todayStr; })
    .sort(function(a,b){ return String(a.event_date).localeCompare(String(b.event_date)) || String(a.start_time||"").localeCompare(String(b.start_time||"")); });
  if (limit) evs = evs.slice(0, limit);
  if (!evs.length) return "<div class='empty'>예정된 일정이 없습니다.</div>";
  var h = "<div class='sched'>";
  evs.forEach(function(c){
    var ds = String(c.event_date).slice(0,10); var dt = parseDate(ds);
    var isToday = ds===todayStr;
    var time = c.all_day ? "" : ((c.start_time?String(c.start_time).slice(0,5):"")+(c.end_time?("–"+String(c.end_time).slice(0,5)):""));
    h += "<div class='sched-item"+(isToday?" today":"")+"'><div class='sched-when'><div class='d tnum'>"+ds.slice(5)+"</div><div class='w'>"+(dt?DOW[dt.getDay()]:"")+"</div></div>"+
      "<div class='sched-main'><div class='sched-title'>"+esc(c.title||"일정")+"</div><div class='sched-meta'>"+
      (time?"<span class='tnum'>"+time+"</span>":"")+(c.all_day?"<span class='pill allday'>종일</span>":"")+(isToday?"<span class='pill today'>오늘</span>":"")+"</div></div></div>";
  });
  return h+"</div>";
}

function mountTimeProgress(grid, nowEl){
  var now = seoulNow();
  var y=now.getFullYear(), mo=now.getMonth(), dd=now.getDate();
  function clamp(r){ return Math.max(0, Math.min(100, r)); }
  function rp(a,b){ return clamp((now-a)/(b-a)*100); }
  var back = (now.getDay()+6)%7;
  var items = [
    {key:"year",  label:"올해",    cap:"올해는",   v:rp(new Date(y,0,1), new Date(y+1,0,1))},
    {key:"month", label:"이번 달", cap:"이번 달은", v:rp(new Date(y,mo,1), new Date(y,mo+1,1))},
    {key:"week",  label:"이번 주", cap:"이번 주는", v:rp(new Date(y,mo,dd-back), new Date(y,mo,dd-back+7))},
    {key:"today", label:"오늘",    cap:"오늘은",   v:rp(new Date(y,mo,dd), new Date(y,mo,dd+1))}
  ];
  var h="";
  items.forEach(function(it){ var val=it.v.toFixed(1);
    h += "<div class='tp-item'><div class='tp-head'><span class='tp-label'>"+it.label+"</span><span class='tp-val'>"+val+"%</span></div>"+
      "<div class='tp-bar'><i class='"+it.key+"' style='width:"+val+"%'></i></div><div class='tp-cap'>"+it.cap+" <b>"+val+"%</b> 지났어요</div></div>";
  });
  grid.innerHTML = h;
  if (nowEl) nowEl.textContent = "기준 "+ymd(now)+" "+pad2(now.getHours())+":"+pad2(now.getMinutes());
}

function projectCards(list, withActions){
  if (!list.length) return "<div class='empty' style='grid-column:1/-1'>등록된 프로젝트가 없습니다.</div>";
  return list.map(function(p){
    var cls = typeCls(p.type); var sc = statusCls(p.status);
    var pct = Math.max(0, Math.min(100, Number(p.progress)||0));
    var period = (String(p.start_date||"").slice(0,10))+" ~ "+(String(p.end_date||"").slice(5,10)||"미정");
    var act = withActions ? "<div class='card-actions'><button class='btn sm ghost' data-edit='"+p.id+"'>수정</button><button class='btn sm ghost danger' data-del='"+p.id+"'>삭제</button></div>" : "";
    return "<div class='card'><div class='card-top'><div><div class='card-name'>"+esc(p.name||"")+"</div><div class='card-period tnum'>"+esc(period)+"</div></div><span class='tag "+cls+"'>"+esc(p.type||"")+"</span></div>"+
      "<div class='card-mid'><div class='amount tnum'>"+moneyMan(p.contract_amount)+"</div><span class='status "+sc+"'><span class='dot'></span>"+esc(p.status||"")+"</span></div>"+
      "<div><div style='display:flex;justify-content:space-between;margin-bottom:6px'><span class='pct'>진행률</span><span class='pct tnum'>"+pct+"%</span></div><div class='prog'><i class='"+(pct===0?"zero":cls)+"' style='width:"+Math.max(pct,2)+"%'></i></div></div>"+
      (p.next_action?"<div class='next'><span class='k'>다음 액션</span><span>"+esc(p.next_action)+"</span></div>":"")+act+"</div>";
  }).join("");
}

function renderTodos(){
  var d = state.data, now = seoulNow(), today = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var list = (d.actions||[]).slice().sort(function(a,b){
    if (!!a.done !== !!b.done) return a.done?1:-1;
    return String(a.due||"9999").localeCompare(String(b.due||"9999"));
  });
  var html = pageHead("todos","기한순 · D-day 배지 · 완료 토글","<button class='btn primary' data-add>+ 할일 추가</button>");
  html += "<section class='panel'><div class='actions' style='padding:6px 12px 10px'>";
  if (!list.length) html += "<div class='empty'>할일이 없습니다. 새 할일을 추가해 보세요.</div>";
  list.forEach(function(a){
    var dd=""; var cls="far"; var ddText="—";
    var due = parseDate(a.due);
    if (due){ var diff = Math.round((due-today)/86400000);
      ddText = diff===0?"D-DAY": diff>0?("D-"+diff):("D+"+(-diff));
      cls = a.done?"far": diff<0?"over": diff<=3?"soon": diff<=7?"mid":"far"; }
    html += "<div class='todo"+(a.done?" done":"")+"'><div class='chk' data-toggle='"+a.id+"'>✓</div>"+
      "<div class='dday "+cls+" tnum'>"+ddText+"</div>"+

      "<span class='tnum'>기한 "+esc(String(a.due||"미정").slice(0,10))+"</span>"+
      (a.owner?"<span>담당 "+esc(a.owner)+"</span>":"<span class='owner-none'>담당 미지정</span>")+
      (a.source?"<span>출처 "+esc(a.source)+"</span>":"")+"</div></div>"+
      "<div class='row-actions'><button class='icon-btn' data-edit='"+a.id+"'>✎</button><button class='icon-btn del' data-del='"+a.id+"'>🗑</button></div></div>";
  });
  html += "</div></section>";

      crud("PATCH","actions",id,{done: !row.done}); };

}

var plSearch="", plType="전체", plStatus="전체", plClient="전체";

/* 상세 뷰 좌측패널 상태 */
var projSelId = localStorage.getItem("appleseed_proj_sel") || null, projSearch = "", projFilter = "전체";

function projRevMap(){
  var m={}; (state.data.revenue||[]).forEach(function(r){ var k=String(r.project||""); if(!k) return; m[k]=(m[k]||0)+(Number(r.amount)||0); }); return m;
}
function plMatch(p, exceptDim){
  var q=String(plSearch||"").trim().toLowerCase();
  if (q){ var hay=(String(p.name||"")+" "+String(p.client||"")+" "+String(p.status||"")).toLowerCase(); if(hay.indexOf(q)<0) return false; }
  if (exceptDim!=="type" && plType!=="전체" && String(p.type||"")!==plType) return false;
  if (exceptDim!=="status" && plStatus!=="전체" && String(p.status||"")!==plStatus) return false;
  if (exceptDim!=="client" && plClient!=="전체" && String(p.client||"")!==plClient) return false;
  return true;
}
function plFiltered(){ return (state.data.projects||[]).filter(function(p){ return plMatch(p,null); }); }
function plCount(dim, val, field){
  return (state.data.projects||[]).filter(function(p){ return plMatch(p,dim) && (val==="전체" || String(p[field]||"")===val); }).length;
}
function plChipRow(labelText, dim, field, vals, active){
  var h="<div class='proj-frow'><span class='proj-frow-k'>"+esc(labelText)+"</span><div class='proj-chips'>";
  vals.forEach(function(v){ var n=plCount(dim,v,field);
    h += "<button class='proj-chip"+(String(v)===String(active)?" on":"")+"' data-plf-dim='"+dim+"' data-plf-val='"+esc(v)+"'>"+esc(v)+"<span class='chip-n'>"+n+"</span></button>"; });
  return h+"</div></div>";
}
function pField(k, vHtml, wide){
  return "<div class='proj-field"+(wide?" wide":"")+"'><span class='pf-k'>"+esc(k)+"</span><div class='pf-v'>"+vHtml+"</div></div>";
}
function ddayInfo(due, today, done){
  var dd = parseDate(due), cls="far", txt="—";
  if (dd){ var diff = Math.round((dd-today)/86400000);
    txt = diff===0?"D-DAY": diff>0?("D-"+diff):("D+"+(-diff));
    cls = done?"far": diff<0?"over": diff<=3?"soon": diff<=7?"mid":"far"; }
  return { cls:cls, txt:txt };
}
function needRow(go, ico, label, n, amtHtml){
  return "<button class='proj-need-row"+(n?"":" zero")+"' data-need-go='"+esc(go)+"'>"+
    "<span class='pn-ico'>"+ico+"</span><span class='pn-txt'>"+esc(label)+"</span>"+
    "<span class='pn-cnt"+(n?" hot":"")+"'>"+n+"건</span>"+
    (amtHtml?"<span class='pn-amt tnum'>"+amtHtml+"</span>":"")+"</button>";
}
function mountMiniCalendar(container){
  var now = seoulNow();
  var today = { y:now.getFullYear(), m:now.getMonth()+1, d:now.getDate() };
  var st = { y:today.y, m:today.m }, map = {};
  collectMarkers().forEach(function(mk){ (map[mk.date]=map[mk.date]||[]).push(mk); });
  container.innerHTML =
    "<div class='proj-cal'><div class='proj-cal-nav'>"+
    "<button class='cal-nav-btn' data-mnav='-1'>◀</button>"+
    "<div class='proj-cal-title' data-mlabel></div>"+
    "<button class='cal-nav-btn' data-mnav='1'>▶</button></div>"+
    "<div class='cal-grid' data-mgrid></div></div>";
  var grid = container.querySelector("[data-mgrid]"), label = container.querySelector("[data-mlabel]");
  function draw(){
    label.textContent = st.y+"년 "+st.m+"월";
    var h = "";
    DOW.forEach(function(dw,i){ h += "<div class='cal-dow"+(i===0?" sun":"")+"'>"+dw+"</div>"; });
    var startDow = new Date(st.y,st.m-1,1).getDay(), dim = new Date(st.y,st.m,0).getDate();
    for (var i=0;i<startDow;i++) h += "<div class='cal-cell empty'></div>";
    for (var dd=1; dd<=dim; dd++){
      var kk = st.y+"-"+pad2(st.m)+"-"+pad2(dd), items = map[kk]||[];
      var cls = "cal-cell"+(items.length?" has":"")+((st.y===today.y&&st.m===today.m&&dd===today.d)?" today":"");
      var dots = "";
      DOT_ORDER.forEach(function(tp){ if(items.some(function(it){return it.type===tp;})) dots += "<span class='cdot "+tp+"'></span>"; });
      var tip = "";
      if (items.length){
        var rows = items.map(function(it){ return "<div class='tt-row'><span>"+TYPE_LABEL[it.type]+"</span><span>"+esc(it.title)+"</span></div>"; }).join("");
        tip = " data-tip=\"<b>"+kk+"</b>"+rows.replace(/"/g,"&quot;")+"\"";
      }
      h += "<div class='"+cls+"'"+tip+"><div class='cnum'>"+dd+"</div><div class='cal-dots'>"+dots+"</div></div>";
    }
    grid.innerHTML = h;
  }
  container.querySelectorAll("[data-mnav]").forEach(function(b){
    b.onclick = function(){ st.m += (+b.getAttribute("data-mnav"));
      if (st.m<1){ st.m=12; st.y--; } if (st.m>12){ st.m=1; st.y++; } draw(); };
  });
  draw();
}

  else { html += "<table><thead><tr><th>월</th><th class='r'>매출(확정)</th><th class='r'>매출(대기)</th><th class='r'>매입</th><th class='r'>순이익(확정)</th></tr></thead><tbody>";
    var tD=0,tW=0,tC=0;
    rows.forEach(function(r){ tD+=r.done; tW+=r.wait; tC+=r.cost;
      var np = r.done - r.cost;
      html += "<tr><td class='tnum'>"+esc(r.key)+"</td><td class='r tnum'>"+moneyMan(r.done)+"</td><td class='r tnum'>"+moneyMan(r.wait)+"</td><td class='r tnum'>"+moneyMan(r.cost)+"</td><td class='r tnum' style='color:"+(np>=0?"var(--pos)":"var(--urgent)")+"'>"+moneyMan(np)+"</td></tr>"; });

/* ---- AI 유튜브 (브리핑의 [유튜브 최신 영상] 섹션만 날짜별 모음) ---- */
var YT_MARK = "[유튜브 최신 영상]";
function ytSectionOf(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return "";
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);   /* 다음 섹션 헤더 직전까지 */
  return (nx > -1 ? rest.slice(0, nx) : rest).trim();
}
function stripYtSection(content){
  var c = String(content||"");
  var i = c.indexOf(YT_MARK);
  if (i < 0) return c;
  var rest = c.slice(i + YT_MARK.length);
  var nx = rest.search(/\n\[[^\[\]\n]+\]/);
  return (c.slice(0, i) + (nx > -1 ? rest.slice(nx) : "")).replace(/\n{3,}/g, "\n\n").trim();
}
function renderYoutube(){
  var d = state.data;
  var noteDesc = "매일 아침 브리핑에서 수집한 AI 관련 유튜브 영상 모음입니다 (생성형 AI · 바이브코딩 · AI 영상 제작).";
  var html = pageHead("youtube", noteDesc, "");
  var briefs = (d.reports||[]).slice()
    .filter(function(r){ return String(r.rtype||"")==="브리핑" && ytSectionOf(r.content); })
    .sort(function(a,b){ return String(b.report_date||"").localeCompare(String(a.report_date||"")); })
    .slice(0, 30);
  if (!briefs.length){
    html += "<section class='panel' style='background:transparent;border:0;box-shadow:none'><div class='placeholder'><div class='ico'>▶️</div><h3>아직 수집된 유튜브 영상이 없습니다</h3><p>매일 아침 7시 브리핑 발행 시 자동으로 쌓입니다.</p></div></section>";
    C.innerHTML = html; return;
  }
  briefs.forEach(function(r, bi){
    var sec = ytSectionOf(r.content);
    var cnt = (sec.match(/^•/gm)||[]).length;
    html += "<section class='panel"+(bi>0?" collapsed":"")+"'"+(bi>0?" data-foldsec":"")+">"+
      "<div class='sec-head"+(bi>0?" fold-head' data-fold":"'")+"><div><div class='eyebrow'>AI 유튜브</div>"+
      "<h3 class='tnum'>"+esc(String(r.report_date||"").slice(0,10))+"</h3></div>"+
      "<div style='display:flex;align-items:center;gap:10px'><div class='sec-note'>"+cnt+"편</div>"+
      (bi>0?"<span class='fold-btn'>▾</span>":"")+"</div></div>"+
      "<div class='rep-content' style='padding:8px 14px 14px'>"+richReport(sec)+"</div></section>";
  });
  C.innerHTML = html;
